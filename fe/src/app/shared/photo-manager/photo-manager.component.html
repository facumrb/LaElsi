<div
  class="flex flex-col items-center gap-4 p-4 border rounded-xl bg-gray-50 border-gray-100"
>
  <div class="relative group">
    <div
      class="w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-md flex items-center justify-center bg-gray-200"
    >
      @if (previewUrl()) {
        <img
          [src]="previewUrl()"
          alt="Foto de perfil"
          class="w-full h-full object-cover"
        />
      } @else {
        <span class="text-3xl font-bold text-gray-400 select-none uppercase">
          {{ userInitials() }}
        </span>
      }
    </div>

    <label
      for="fileUploadInput"
      class="absolute bottom-1 right-1 bg-[#3d4494] text-white p-2 rounded-full cursor-pointer shadow-lg hover:bg-[#2d336b] transition-all hover:scale-110 flex items-center justify-center"
      title="Cambiar foto"
    >
      <ng-icon name="bootstrapCamera" class="text-lg"></ng-icon>
      <input
        #fileInput
        id="fileUploadInput"
        name="profilePhoto"
        type="file"
        class="hidden"
        accept="image/*"
        (click)="$event.stopPropagation(); fileInput.value = ''"
        (change)="onFileSelected($event)"
      />
    </label>
  </div>

  <div class="text-center min-h-7.5">
    @if (previewUrl()) {
      <button
        (click)="markForDeletion()"
        type="button"
        class="text-xs text-red-500 hover:text-red-700 flex items-center gap-1 cursor-pointer font-medium mx-auto"
      >
        <ng-icon name="bootstrapTrash"></ng-icon> Eliminar foto
      </button>
    } @else {
      <p class="text-xs text-gray-400">Sin foto de perfil</p>
    }
  </div>
</div>
