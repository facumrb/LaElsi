@if (totalPages() > 1) {
  <div class="pagination-container">
    <div class="pagination-controls">
      <!-- Botón Anterior -->
      <button
        (click)="onPageChange(currentPage() - 1)"
        [disabled]="currentPage() === 1"
        class="pagination-btn"
        aria-label="Página anterior"
      >
        <ng-icon name="bootstrapChevronLeft" class="text-lg"></ng-icon>
      </button>

      <!-- Números de Página -->
      @for (page of visiblePages(); track page) {
        <button
          (click)="onPageChange(page)"
          [attr.aria-current]="page === currentPage() ? 'page' : null"
          [attr.aria-label]="'Ir a la página ' + page"
          [class]="
            page === currentPage() ? 'pagination-btn-active' : 'pagination-btn'
          "
        >
          {{ page }}
        </button>
      }

      <!-- Botón Siguiente -->
      <button
        (click)="onPageChange(currentPage() + 1)"
        [disabled]="currentPage() === totalPages()"
        class="pagination-btn"
        aria-label="Página siguiente"
      >
        <ng-icon name="bootstrapChevronRight" class="text-lg"></ng-icon>
      </button>
    </div>

    <!-- Indicador de total de páginas -->
    <span class="pagination-info">
      Página {{ currentPage() }} de {{ totalPages() }}
    </span>
  </div>
}
