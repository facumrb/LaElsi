@if (totalPages() > 1) {
  <div class="flex items-center justify-center gap-2 mt-8 mb-4">
    <!-- Botón Anterior -->
    <button
      (click)="onPageChange(currentPage() - 1)"
      [disabled]="currentPage() === 1"
      class="cursor-pointer flex items-center justify-center w-10 h-10 rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      aria-label="Página anterior"
    >
      <ng-icon name="bootstrapChevronLeft" class="text-lg"></ng-icon>
    </button>

    <!-- Números de Página -->
    @for (page of visiblePages(); track page) {
      @if (page === -1) {
        <span
          class="flex items-center justify-center w-10 h-10 text-gray-400"
          aria-hidden="true"
        >
          ...
        </span>
      } @else {
        <button
          (click)="onPageChange(page)"
          [attr.aria-current]="page === currentPage() ? 'page' : null"
          [attr.aria-label]="'Ir a la página ' + page"
          [class]="
            page === currentPage()
              ? 'cursor-pointer flex items-center justify-center w-10 h-10 rounded-lg bg-emerald-600 text-white font-medium shadow-sm transition-colors'
              : 'cursor-pointer flex items-center justify-center w-10 h-10 rounded-lg border border-gray-200 text-gray-700 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-200 transition-colors'
          "
        >
          {{ page }}
        </button>
      }
    }

    <!-- Botón Siguiente -->
    <button
      (click)="onPageChange(currentPage() + 1)"
      [disabled]="currentPage() === totalPages()"
      class="cursor-pointer flex items-center justify-center w-10 h-10 rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
      aria-label="Página siguiente"
    >
      <ng-icon name="bootstrapChevronRight" class="text-lg"></ng-icon>
    </button>
  </div>
}
