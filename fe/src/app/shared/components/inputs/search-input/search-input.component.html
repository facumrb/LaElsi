<div class="relative w-full h-full">
  <div
    class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3"
  >
    <ng-icon
      name="bootstrapSearch"
      class="text-xl text-gray-400 shrink-0"
    ></ng-icon>
  </div>
  <input
    type="text"
    [(ngModel)]="query"
    inputmode="search"
    [placeholder]="placeholder()"
    class="block w-full h-full rounded-lg border border-gray-300 pl-10 pr-3 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-black focus:ring-1 focus:ring-black leading-6 py-2"
  />
</div>
