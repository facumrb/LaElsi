<div
  class="mt-1 min-h-5 text-xs"
  [class.flex]="showCounter()"
  [class.justify-between]="showCounter()"
  [class.items-start]="showCounter()"
>
  <!-- Error / Estado -->
  <div>
    @if (isAsyncMode()) {
      @if (isPending()) {
        <span class="text-gray-500 flex items-center gap-1">
          <ng-icon
            name="bootstrapArrowClockwise"
            class="animate-spin"
          ></ng-icon>
          Verificando...
        </span>
      } @else if (isAvailable()) {
        <span class="text-emerald-600 flex items-center gap-1">
          <ng-icon name="bootstrapCheckCircleFill"></ng-icon>
          {{ validLabel() }}
        </span>
      } @else if (hasErrors()) {
        <span class="text-red-600 flex items-center gap-1">
          @if (hasTakenError()) {
            <ng-icon name="bootstrapXCircleFill"></ng-icon>
          }
          {{ errorText() }}
        </span>
      }
    } @else {
      @if (hasErrors()) {
        <span class="text-red-600">{{ errorText() }}</span>
      }
    }
  </div>

  <!-- Contador de caracteres (opcional) -->
  @if (showCounter()) {
    <div class="text-xs text-gray-500 shrink-0">
      {{ currentLength() }} / {{ maxLength() }}
    </div>
  }
</div>
