<header>
  <nav class="sup">
    <a routerLink="/">
      <img src="assets/Logo.png" alt="La Elsi logo" width="120" />
    </a>
    <div class="buscar">
      <input
        type="text"
        class="form-control"
        placeholder="Buscar articulo..."
      />
      <button class="btn btn-primary" type="submit">
        <i class="bi bi-search"></i>
      </button>
    </div>
    <div class="login-carrito">
      <a routerLink="/login">
        <button class="btn btn-primary">
          <i class="bi bi-person-circle"></i> {{ userSignal() }}
        </button>
      </a>
      <a routerLink="/carrito">
        <button class="btn btn-primary">
          <i class="bi bi-cart4"></i> {{ carritoSignal() }}
        </button>
      </a>
    </div>
  </nav>
  <nav class="inf">
    <a
      routerLink="/jugueteria"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Juguetería
    </a>
    <a
      routerLink="/computacion"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Computación
    </a>
    <a
      routerLink="/impresiones"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Impresiones
    </a>
    <a
      routerLink="/disenio"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Diseño Gráfico
    </a>
    <a
      routerLink="/sellos"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Sellos
    </a>
    <a
      routerLink="/libreria"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Librería
    </a>
  </nav>
</header>
