<div class="animate-fadeIn container mx-auto">
  <app-clients-toolbar
    [(searchQuery)]="searchQuery"
    [(fiscalFilter)]="fiscalFilter"
    (onAdd)="handleNavigateToCreate()"
  />

  <app-clients-list
    class="mt-6 block"
    [clients]="clientsFiltered()"
    [isFilterActive]="filtersActive()"
    (onEdit)="handleNavigateToEdit($event)"
    (onDelete)="handleDelete($event)"
  />

  <app-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)"
  />

  @if (clientToDelete()) {
    <app-confirm-delete-modal
      [entityName]="clientToDelete()!.name + ' ' + clientToDelete()!.lastName"
      entityType="cliente"
      [canDeactivate]="false"
      (confirmDelete)="confirmDeleteClient()"
      (close)="clientToDelete.set(null)"
    />
  }
</div>
