<div
  class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-6 mx-4 lg:mx-0"
>
  <h1 class="text-2xl font-bold text-[#3d4494]">Gestión de Órdenes</h1>

  <div class="flex flex-col lg:flex-row gap-3 w-full lg:w-auto">
    <div class="relative w-full lg:w-80">
      <div
        class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3"
      >
        <ng-icon name="bootstrapSearch" class="text-xl text-gray-400"></ng-icon>
      </div>

      <input
        type="text"
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
        inputmode="search"
        placeholder="Buscar por cliente o ID de orden..."
        class="block w-full rounded-lg border-0 h-10 pl-10 pr-3 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-[#3d4494] leading-6"
      />

      @if (searchQuery()) {
        <button
          (click)="searchQuery.set('')"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 cursor-pointer"
        >
          <ng-icon name="bootstrapX" class="text-xl"></ng-icon>
        </button>
      }
    </div>

    <!-- Filtros -->
    <div class="flex w-full lg:w-auto">
      <div
        class="relative w-full lg:w-auto"
        (clickOutside)="showFilterMenu.set(false)"
      >
        <button
          (click)="toggleMenu()"
          class="cursor-pointer flex w-full justify-center items-center gap-2 px-4 h-10 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-all whitespace-nowrap"
          [class.ring-2]="hayFiltrosActivos()"
          [class.ring-[#3d4494]]="hayFiltrosActivos()"
          [class.bg-indigo-50]="hayFiltrosActivos()"
        >
          @if (hayFiltrosActivos()) {
            <ng-icon
              name="bootstrapFunnelFill"
              class="text-xl text-[#3d4494] shrink-0"
            ></ng-icon>
          } @else {
            <ng-icon name="bootstrapFunnel" class="text-xl shrink-0"></ng-icon>
          }
          <span>Filtros</span>
        </button>

        @if (showFilterMenu()) {
          <div
            class="absolute left-0 lg:left-auto lg:right-0 mt-2 w-72 max-w-[90vw] origin-top-left lg:origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 z-50"
          >
            <div class="p-4 space-y-4">
              <div>
                <h2
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
                >
                  Filtrar por Estado
                </h2>
                <div class="space-y-2">
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="estado"
                      [checked]="statusFilter() === 'Todos'"
                      (change)="statusFilter.set('Todos')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Todos</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="estado"
                      [checked]="statusFilter() === OrderState.Pending"
                      (change)="statusFilter.set(OrderState.Pending)"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Pendiente</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="estado"
                      [checked]="statusFilter() === OrderState.Paid"
                      (change)="statusFilter.set(OrderState.Paid)"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Pagado</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="estado"
                      [checked]="statusFilter() === OrderState.Shipped"
                      (change)="statusFilter.set(OrderState.Shipped)"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Enviado</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="estado"
                      [checked]="statusFilter() === OrderState.Delivered"
                      (change)="statusFilter.set(OrderState.Delivered)"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Entregado</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="estado"
                      [checked]="statusFilter() === OrderState.Cancelled"
                      (change)="statusFilter.set(OrderState.Cancelled)"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Cancelado</span>
                  </label>
                </div>
              </div>

              <hr class="border-gray-100" />

              <div>
                <h2
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
                >
                  Filtrar por Método de Entrega
                </h2>
                <div class="space-y-2">
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="delivery"
                      [checked]="deliveryMethodFilter() === 'Todos'"
                      (change)="deliveryMethodFilter.set('Todos')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Todos</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="delivery"
                      [checked]="
                        deliveryMethodFilter() === DeliveryMethod.Envio
                      "
                      (change)="deliveryMethodFilter.set(DeliveryMethod.Envio)"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Envío</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="delivery"
                      [checked]="
                        deliveryMethodFilter() === DeliveryMethod.RetiroSucursal
                      "
                      (change)="
                        deliveryMethodFilter.set(DeliveryMethod.RetiroSucursal)
                      "
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700"
                      >Retiro en sucursal</span
                    >
                  </label>
                </div>
              </div>

              <button
                (click)="limpiar()"
                class="cursor-pointer w-full mt-2 px-3 h-10 text-xs font-medium text-[#3d4494] bg-indigo-50 rounded hover:bg-indigo-100 transition-colors"
              >
                Limpiar Filtros
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
