<div
  class="relative w-full lg:w-auto block"
  (clickOutside)="showFilterMenu.set(false)"
>
  <app-filter-button
    class="w-full block"
    [isActive]="hayFiltrosActivos()"
    [(isOpen)]="showFilterMenu"
  ></app-filter-button>

  @if (showFilterMenu()) {
    <div
      class="absolute left-0 lg:left-auto lg:right-0 mt-2 top-full w-72 max-w-[90vw] origin-top-left lg:origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 z-50"
      role="region"
      aria-label="Opciones de filtro de órdenes"
    >
      <div class="p-4 space-y-4">
        <app-filter-accordion
          label="Filtrar por Estado"
          [options]="statusOptions"
          [(selected)]="statusFilter"
        ></app-filter-accordion>

        <hr class="border-gray-100" />

        <app-filter-accordion
          label="Filtrar por Método de Entrega"
          [options]="deliveryOptions"
          [(selected)]="deliveryMethodFilter"
        ></app-filter-accordion>

        <hr class="border-gray-100" />

        <app-filter-accordion
          label="Filtrar por Método de Pago"
          [options]="paymentOptions"
          [(selected)]="paymentMethodFilter"
        ></app-filter-accordion>

        <button
          type="button"
          (click)="limpiar()"
          class="cursor-pointer w-full mt-4 px-3 py-2.5 text-xs font-bold uppercase tracking-wide text-[#3d4494] bg-indigo-50 rounded-lg hover:bg-indigo-100 transition-colors focus:outline-none focus:ring-2 focus:ring-[#3d4494] focus:ring-offset-1"
        >
          Limpiar todos los filtros
        </button>
      </div>
    </div>
  }
</div>
