<div class="animate-fadeIn container mx-auto">
  <app-orders-toolbar [(searchQuery)]="searchQuery" />

  <app-orders-list
    class="mt-6 block"
    [orders]="ordersFiltered()"
    [isFilterActive]="searchQuery().length > 0"
    (onUpdateStatus)="handleUpdateStatus($event)"
    (onUpdateDelivery)="handleUpdateDelivery($event)"
    (onCancel)="handleCancel($event)"
  />
</div>
