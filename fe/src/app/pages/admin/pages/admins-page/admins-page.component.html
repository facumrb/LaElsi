<div class="animate-fadeIn container mx-auto">
  <app-admins-toolbar
    [(searchQuery)]="searchQuery"
    (onAdd)="handleNavigateToCreate()"
  />

  <app-admins-list
    class="mt-6 block"
    [admins]="adminsFiltered()"
    [isFilterActive]="searchQuery().length > 0"
    (onEdit)="handleNavigateToEdit($event)"
    (onDelete)="handleDelete($event)"
  />

  <app-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)"
  />

  @if (adminToDelete()) {
    <app-confirm-delete-modal
      [entityName]="adminToDelete()!.name + ' ' + adminToDelete()!.lastName"
      entityType="administrador"
      [canDeactivate]="false"
      (confirmDelete)="confirmDeleteAdmin()"
      (close)="adminToDelete.set(null)"
    />
  }
</div>
