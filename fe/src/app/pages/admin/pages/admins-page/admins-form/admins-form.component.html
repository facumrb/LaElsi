<div class="animate-fadeIn max-w-4xl mx-auto">
  <div class="mb-5 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-[#3d4494]">
        {{ isEditMode() ? "Editar Administrador" : "Nuevo Administrador" }}
      </h1>
    </div>

    <app-go-back-button></app-go-back-button>
  </div>

  <div
    class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden"
  >
    <form [formGroup]="formAdmin" (ngSubmit)="onSubmit()" class="p-6 md:p-8">
      <div class="mb-2">
        <h2 class="text-lg font-semibold text-gray-800 mb-3 border-b pb-2">
          Datos Personales
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3">
          <div>
            <label
              for="name"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Nombre <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="name"
              name="name"
              formControlName="name"
              minlength="2"
              maxlength="100"
              class="block w-full rounded-lg border-gray-300 border p-2.5 text-gray-900 shadow-sm text-sm"
              placeholder="Ej: Juan"
            />
            <app-field-error [control]="formAdmin.controls.name" />
          </div>

          <div>
            <label
              for="lastName"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Apellido <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              formControlName="lastName"
              minlength="2"
              maxlength="100"
              class="block w-full rounded-lg border-gray-300 border p-2.5 text-gray-900 shadow-sm text-sm"
              placeholder="Ej: Perez"
            />
            <app-field-error [control]="formAdmin.controls.lastName" />
          </div>

          <div>
            <label
              for="dni"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              DNI <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="dni"
              name="dni"
              formControlName="dni"
              minlength="7"
              maxlength="15"
              inputmode="numeric"
              appNumericInput
              class="block w-full rounded-lg border-gray-300 border p-2.5 text-gray-900 shadow-sm text-sm"
              placeholder="Ej: 12345678"
            />
            <app-field-error
              [control]="formAdmin.controls.dni"
              validLabel="DNI disponible"
            />
          </div>

          <div>
            <label
              for="phone"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Teléfono <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="phone"
              name="phone"
              formControlName="phone"
              minlength="7"
              maxlength="20"
              inputmode="tel"
              appPhoneInput
              class="block w-full rounded-lg border-gray-300 border p-2.5 text-gray-900 shadow-sm text-sm"
              placeholder="Ej: 3415555555"
            />
            <app-field-error [control]="formAdmin.controls.phone" />
          </div>
        </div>
      </div>

      <div class="mb-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-3 border-b pb-2">
          Cuenta de Usuario
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3">
          <div>
            <label
              for="username"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Nombre de Usuario <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="username"
              name="username"
              formControlName="username"
              minlength="4"
              maxlength="30"
              class="block w-full rounded-lg border-gray-300 border p-2.5 text-gray-900 shadow-sm text-sm"
              placeholder="Ej: jperez"
            />
            <app-field-error
              [control]="formAdmin.controls.username"
              validLabel="Usuario disponible"
            />
          </div>

          <div>
            <label
              for="email"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Email <span class="text-red-500">*</span>
            </label>
            <input
              type="email"
              id="email"
              name="email"
              formControlName="email"
              inputmode="email"
              maxlength="255"
              class="block w-full rounded-lg border-gray-300 border p-2.5 text-gray-900 shadow-sm text-sm"
              placeholder="Ej: juan@ejemplo.com"
            />
            <app-field-error
              [control]="formAdmin.controls.email"
              validLabel="Email disponible"
            />
          </div>

          <div class="flex justify-center md:justify-start pt-2">
            <div class="w-full">
              <app-photo-manager
                [currentPhoto]="currentPhoto()"
                [userFullName]="fullName"
              ></app-photo-manager>
            </div>
          </div>

          <div>
            <label
              for="password"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              Contraseña
              @if (!isEditMode()) {
                <span class="text-red-500">*</span>
              }
            </label>
            <input
              type="password"
              id="password"
              name="password"
              formControlName="password"
              maxlength="100"
              class="block w-full rounded-lg border-gray-300 border p-2.5 text-gray-900 shadow-sm text-sm"
              placeholder="{{
                isEditMode()
                  ? 'Dejar vacío para mantener la actual'
                  : 'Mínimo 8 caracteres, 1 letra, 1 número.'
              }}"
            />
            <app-field-error [control]="formAdmin.controls.password" />
          </div>
        </div>
      </div>

      @if (isEditMode()) {
        <app-audit-info
          [createdAt]="formAdmin.get('createdAt')?.value"
          [updatedAt]="formAdmin.get('updatedAt')?.value"
          [deletedAt]="formAdmin.get('deletedAt')?.value"
        />
      }

      <div
        class="pt-6 flex items-center justify-end gap-x-4 border-t border-gray-100"
      >
        <button
          type="button"
          routerLink="/admin/admins"
          class="cursor-pointer rounded-md bg-white px-5 py-2.5 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 transition-colors"
        >
          Cancelar
        </button>

        <button
          type="submit"
          [disabled]="formAdmin.invalid || !hasRealChanges || formPending"
          class="cursor-pointer rounded-md bg-[#3d4494] px-8 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-[#2a2f63] focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-[#3d4494] disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
        >
          {{ isEditMode() ? "Guardar Cambios" : "Crear Administrador" }}
        </button>
      </div>
    </form>
  </div>
</div>
