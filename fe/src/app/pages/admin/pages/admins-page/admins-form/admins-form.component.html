<div class="animate-fadeIn max-w-4xl mx-auto page-container-adaptive">
  <div class="mb-5 flex items-center justify-between">
    <div>
      <h1 class="page-title">
        {{ isEditMode() ? "Editar Administrador" : "Nuevo Administrador" }}
      </h1>
    </div>

    <app-go-back-button></app-go-back-button>
  </div>

  <div class="form-card">
    <form [formGroup]="formAdmin" (ngSubmit)="onSubmit()" class="form-body">
      <div class="mb-2">
        <h2 class="form-section-title">
          Datos Personales
        </h2>

        <div class="form-grid-2">
          <div>
            <label
              for="name"
              class="form-label"
            >
              Nombre <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="name"
              name="name"
              formControlName="name"
              minlength="2"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Juan"
            />
            <app-field-error [control]="formAdmin.controls.name" />
          </div>

          <div>
            <label
              for="lastName"
              class="form-label"
            >
              Apellido <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              formControlName="lastName"
              minlength="2"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Perez"
            />
            <app-field-error [control]="formAdmin.controls.lastName" />
          </div>

          <div>
            <label
              for="dni"
              class="form-label"
            >
              DNI <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="dni"
              name="dni"
              formControlName="dni"
              minlength="7"
              maxlength="15"
              inputmode="numeric"
              appNumericInput
              class="form-input"
              placeholder="Ej: 12345678"
            />
            <app-field-error
              [control]="formAdmin.controls.dni"
              validLabel="DNI disponible"
            />
          </div>

          <div>
            <label
              for="phone"
              class="form-label"
            >
              Teléfono <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="phone"
              name="phone"
              formControlName="phone"
              minlength="7"
              maxlength="20"
              inputmode="tel"
              appPhoneInput
              class="form-input"
              placeholder="Ej: 3415555555"
            />
            <app-field-error [control]="formAdmin.controls.phone" />
          </div>
        </div>
      </div>

      <div class="mb-6">
        <h2 class="form-section-title">
          Cuenta de Usuario
        </h2>

        <div class="form-grid-2">
          <div>
            <label
              for="username"
              class="form-label"
            >
              Nombre de Usuario <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="username"
              name="username"
              formControlName="username"
              minlength="4"
              maxlength="30"
              class="form-input"
              placeholder="Ej: jperez"
            />
            <app-field-error
              [control]="formAdmin.controls.username"
              validLabel="Usuario disponible"
            />
          </div>

          <div>
            <label
              for="email"
              class="form-label"
            >
              Email <span class="text-red-500">*</span>
            </label>
            <input
              type="email"
              id="email"
              name="email"
              formControlName="email"
              inputmode="email"
              maxlength="255"
              class="form-input"
              placeholder="Ej: juan@ejemplo.com"
            />
            <app-field-error
              [control]="formAdmin.controls.email"
              validLabel="Email disponible"
            />
          </div>

          <div class="flex justify-center md:justify-start pt-2 md:col-span-2">
            <div class="w-full">
              <app-photo-manager
                [currentPhoto]="currentPhoto()"
                [userFullName]="fullName"
              ></app-photo-manager>
            </div>
          </div>

          <div>
            <label
              for="password"
              class="form-label"
            >
              Contraseña
              @if (!isEditMode()) {
                <span class="text-red-500">*</span>
              }
            </label>
            <input
              type="password"
              id="password"
              name="password"
              formControlName="password"
              maxlength="100"
              class="form-input"
              placeholder="{{
                isEditMode()
                  ? 'Dejar vacío para mantener la actual'
                  : 'Mínimo 8 caracteres, 1 letra, 1 número.'
              }}"
            />
            <app-field-error [control]="formAdmin.controls.password" />
          </div>

          <div>
            <label for="confirmPassword" class="form-label">
              Confirmar Contraseña
              @if (!isEditMode()) {
                <span class="text-red-500">*</span>
              }
            </label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              formControlName="confirmPassword"
              maxlength="100"
              class="form-input"
              placeholder="{{
                isEditMode()
                  ? 'Repetir nueva contraseña'
                  : 'Repetir la contraseña ingresada'
              }}"
            />
            <!-- El error reside en el grupo, lo mostramos aquí si las contraseñas no coinciden -->
            @if (
              formAdmin.hasError("passwordsNotEqual") &&
              (formAdmin.get("confirmPassword")?.touched ||
                formAdmin.get("password")?.touched)
            ) {
              <p class="text-red-500 text-xs mt-1">
                Las contraseñas no coinciden.
              </p>
            }
          </div>
        </div>
      </div>

      @if (isEditMode()) {
        <app-audit-info
          [createdAt]="auditCreatedAt()"
          [updatedAt]="auditUpdatedAt()"
          [isActive]="true"
          [statusDate]="auditStatusDate()"
        />
      }

      <div class="form-footer">
        <button
          type="button"
          routerLink="/admin/admins"
          class="btn-secondary"
        >
          Cancelar
        </button>

        <button
          type="submit"
          [disabled]="!formAdmin.valid || !hasRealChanges"
          class="btn-primary px-8"
        >
          {{ isEditMode() ? "Guardar Cambios" : "Crear Administrador" }}
        </button>
      </div>
    </form>
  </div>
</div>
