<div class="container mx-auto min-h-screen p-6">
  <div class="mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold uppercase tracking-wide text-[#3d4494]">
      Gestión de Categorías
    </h1>

    <button
      class="flex items-center gap-2 rounded-md bg-[#037971] px-4 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-[#049A8F]"
      (click)="openAddModal()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 4.5v15m7.5-7.5h-15"
        />
      </svg>
      Agregar Categoría
    </button>
  </div>

  <app-categorias-list
    [categorias]="categorias()"
    (onEdit)="openEditModal($event)"
    (onDelete)="delete($event)"
  />
</div>

@if (isModalOpen()) {
  <app-categorias-modal
    [categoryData]="selectedCategory()"
    (close)="isModalOpen.set(false)"
    (save)="modalSubmit($event)"
  />
}
