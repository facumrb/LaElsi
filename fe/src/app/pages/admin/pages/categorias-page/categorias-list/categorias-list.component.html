<div class="overflow-hidden rounded-lg border border-gray-200 shadow-md">
  <div class="overflow-x-auto">
    <table
      class="w-full border-collapse bg-white text-left text-sm text-gray-500"
    >
      <thead class="hidden bg-[#3d4494] text-white md:table-header-group">
        <tr>
          <th class="px-6 py-4 font-semibold uppercase tracking-wider">
            Nombre
          </th>
          <th class="px-6 py-4 font-semibold uppercase tracking-wider">
            Descripción
          </th>
          <th
            class="px-6 py-4 text-center font-semibold uppercase tracking-wider"
          >
            Productos
          </th>
          <th class="px-6 py-4 font-semibold uppercase tracking-wider">
            Estado
          </th>
          <th
            class="px-6 py-4 text-center font-semibold uppercase tracking-wider"
          >
            Acciones
          </th>
        </tr>
      </thead>

      <tbody class="divide-y divide-gray-100 border-t border-gray-100">
        @for (categoria of categorias(); track categoria.id) {
          <tr
            class="block transition-colors hover:bg-gray-50 md:table-row border-b md:border-none mb-4 md:mb-0"
          >
            <td class="block px-6 py-4 font-medium text-gray-900 md:table-cell">
              <span class="font-bold text-[#3d4494] md:hidden block mb-1"
                >Nombre:</span
              >
              {{ categoria.nombre }}
            </td>

            <td class="block px-6 py-4 text-gray-600 md:table-cell md:max-w-50">
              <span class="font-bold text-[#3d4494] md:hidden block mb-1"
                >Descripción:</span
              >
              <div class="whitespace-normal wrap-break-words">
                {{ categoria.descripcion }}
              </div>
            </td>

            <td class="block px-6 py-4 md:table-cell text-left md:text-center">
              <span class="font-bold text-[#3d4494] md:hidden inline-block mr-2"
                >Productos:</span
              >

              <button
                (click)="
                  (categoria.items?.length || 0) > 0
                    ? verProductos(categoria)
                    : null
                "
                [disabled]="(categoria.items?.length || 0) === 0"
                class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-medium transition-all duration-200"
                [class.bg-indigo-100]="(categoria.items?.length || 0) > 0"
                [class.text-indigo-700]="(categoria.items?.length || 0) > 0"
                [class.hover:bg-indigo-200]="(categoria.items?.length || 0) > 0"
                [class.cursor-pointer]="(categoria.items?.length || 0) > 0"
                [class.bg-gray-100]="(categoria.items?.length || 0) === 0"
                [class.text-gray-400]="(categoria.items?.length || 0) === 0"
                [class.cursor-default]="(categoria.items?.length || 0) === 0"
                title="Ver lista de productos"
              >
                <span class="font-bold">{{
                  categoria.items?.length || 0
                }}</span>

                @if ((categoria.items?.length || 0) > 0) {
                  <span>Ver</span>
                }
              </button>
            </td>

            <td class="block px-6 py-4 md:table-cell">
              <span class="font-bold text-[#3d4494] md:hidden inline-block mr-2"
                >Estado:</span
              >
              <span
                class="inline-flex rounded-full px-2 text-xs font-semibold leading-5"
                [class.bg-green-100]="categoria.estado === 'Activo'"
                [class.text-green-800]="categoria.estado === 'Activo'"
                [class.bg-red-100]="categoria.estado === 'Inactivo'"
                [class.text-red-800]="categoria.estado === 'Inactivo'"
              >
                {{ categoria.estado }}
              </span>
            </td>

            <td class="block px-6 py-4 md:table-cell">
              <span class="font-bold text-[#3d4494] md:hidden block mb-2"
                >Acciones:</span
              >
              <div class="flex justify-start md:justify-center gap-4">
                <button
                  (click)="onEdit.emit(categoria)"
                  class="text-blue-600 hover:text-blue-900"
                  title="Editar"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-5"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"
                    />
                  </svg>
                </button>
                <button
                  (click)="onDelete.emit(categoria.id)"
                  class="text-red-600 hover:text-red-900"
                  title="Eliminar"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-5"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
                    />
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
