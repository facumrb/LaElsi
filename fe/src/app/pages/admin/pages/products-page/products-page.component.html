<div class="animate-fadeIn container mx-auto">
  <app-products-toolbar
    [(searchQuery)]="searchQuery"
    [(statusFilter)]="statusFilter"
    [(stockFilter)]="stockFilter"
    [(categoryFilter)]="categoryFilter"
    [categories]="availableCategories()"
    [hasSelection]="selectedIds().length > 0"
    (onAdd)="handleNavigateToCreate()"
    (onBulkPriceUpdate)="handleBulkPriceUpdate()"
  />

  <app-products-list
    class="mt-6 block"
    [products]="productsFiltered()"
    [isFilterActive]="filtersActive()"
    (onEdit)="handleNavigateToEdit($event)"
    (onDelete)="handleDelete($event)"
    [(selectedIds)]="selectedIds"
  />

  @if (productsFiltered().length > 0) {
    <app-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="onPageChange($event)"
    />
  }

  @if (showBulkModal()) {
    <app-bulk-price-modal
      [productIds]="selectedIds()"
      (close)="showBulkModal.set(false)"
      (success)="handleBulkSuccess()"
    ></app-bulk-price-modal>
  }

  @if (productToDelete()) {
    <app-confirm-delete-modal
      [entityName]="productToDelete()!.name"
      entityType="producto"
      [canDeactivate]="true"
      [isDeactivated]="productToDelete()!.state === 'Inactivo'"
      (confirmDelete)="confirmDeleteProduct()"
      (confirmDeactivate)="confirmDeactivateProduct()"
      (close)="productToDelete.set(null)"
    />
  }
</div>
