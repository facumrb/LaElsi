<div
  class="relative col-span-1 sm:w-auto block"
  (clickOutside)="showFilterMenu.set(false)"
>
  <app-filter-button
    [isActive]="hayFiltrosActivos()"
    [(isOpen)]="showFilterMenu"
  ></app-filter-button>

  @if (showFilterMenu()) {
    <div
      class="absolute left-0 sm:left-auto sm:right-0 mt-2 w-72 max-w-[90vw] origin-top-left sm:origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 z-50"
    >
      <div class="p-4 space-y-4">
        <!-- Categoría: mantiene implementación custom con jerarquía -->
        <div class="relative" (clickOutside)="showCategoryMenu.set(false)">
          <h2
            class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
          >
            Filtrar por Categoría
          </h2>

          <button
            type="button"
            (click)="showCategoryMenu.set(!showCategoryMenu())"
            class="relative w-full cursor-pointer bg-white rounded-lg border border-gray-300 py-2.5 pl-3 pr-10 text-left shadow-sm focus:outline-none focus:ring-1 sm:text-sm transition-colors"
          >
            <span class="block truncate text-gray-700">
              {{ selectedCategoryName() }}
            </span>
            <span
              class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2"
            >
              <ng-icon
                name="bootstrapChevronDown"
                class="text-sm text-gray-400 transition-transform duration-200"
                [class.rotate-180]="showCategoryMenu()"
              ></ng-icon>
            </span>
          </button>

          @if (showCategoryMenu()) {
            <div
              class="absolute z-20 mt-1 max-h-60 w-full overflow-auto rounded-md bg-white text-base shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none sm:text-sm animate-fadeIn"
            >
              <div
                (click)="selectCategory('Todos')"
                class="relative cursor-pointer select-none py-2 pl-3 pr-9 text-gray-900 hover:bg-gray-100 transition-colors"
              >
                <span
                  class="block truncate font-normal"
                  [class.font-semibold]="categoryFilter() === 'Todos'"
                  [class.text-[#3d4494]]="categoryFilter() === 'Todos'"
                >
                  Todas las categorías
                </span>
                @if (categoryFilter() === "Todos") {
                  <span
                    class="absolute inset-y-0 right-0 flex items-center pr-4 text-[#3d4494]"
                  >
                    <ng-icon name="bootstrapCheckLg" class="text-lg"></ng-icon>
                  </span>
                }
              </div>

              @for (cat of hierarchicalCategories(); track cat.id) {
                <div
                  (click)="selectCategory(cat.id)"
                  class="relative cursor-pointer select-none py-2 pr-9 text-gray-900 hover:bg-gray-100 transition-colors"
                  [style.padding-left.rem]="0.75 + cat.depth * 1"
                  [class.font-bold]="cat.depth === 0"
                  [class.font-normal]="cat.depth > 0"
                >
                  <div class="flex items-center gap-2">
                    @if (cat.depth > 0) {
                      <span class="text-gray-300">↳</span>
                    }
                    <span
                      class="block truncate"
                      [class.text-[#3d4494]]="categoryFilter() === cat.id"
                    >
                      {{ cat.name }}
                    </span>
                  </div>

                  @if (categoryFilter() === cat.id) {
                    <span
                      class="absolute inset-y-0 right-0 flex items-center pr-4 text-[#3d4494]"
                    >
                      <ng-icon
                        name="bootstrapCheckLg"
                        class="text-lg"
                      ></ng-icon>
                    </span>
                  }
                </div>
              }
            </div>
          }
        </div>

        <hr class="border-gray-100" />

        <app-filter-accordion
          label="Filtrar por Estado"
          [options]="statusOptions"
          [(selected)]="statusFilter"
        ></app-filter-accordion>

        <hr class="border-gray-100" />

        <app-filter-accordion
          label="Filtrar por Stock"
          [options]="stockOptions"
          [(selected)]="stockFilter"
        ></app-filter-accordion>

        <button
          type="button"
          (click)="limpiar()"
          class="cursor-pointer w-full mt-4 px-3 py-2.5 text-xs font-bold uppercase tracking-wide text-[#3d4494] bg-indigo-50 rounded-lg hover:bg-indigo-100 transition-colors focus:outline-none focus:ring-2 focus:ring-[#3d4494] focus:ring-offset-1"
        >
          Limpiar todos los filtros
        </button>
      </div>
    </div>
  }
</div>
