<div class="toolbar-container mb-0">
  <app-toolbar-title title="Productos"></app-toolbar-title>

  <div
    class="flex flex-col lg:flex-row w-full lg:w-auto items-stretch lg:items-center gap-3"
  >
    <div class="w-full lg:w-45 xl:w-72 order-1">
      <app-search-input
        [(query)]="searchQuery"
        placeholder="Buscar producto..."
      ></app-search-input>
    </div>

    <div class="w-full lg:w-auto order-3 lg:order-2">
      <button
        type="button"
        (click)="onBulkPriceUpdate.emit()"
        [disabled]="!hasSelection()"
        class="w-full lg:w-auto flex items-center justify-center gap-2 px-3 h-10 rounded-lg border bg-white whitespace-nowrap transition-colors"
        [class]="
          hasSelection()
            ? 'cursor-pointer border-gray-300 text-gray-700 hover:bg-green-50 hover:text-green-700 hover:border-green-200'
            : 'cursor-not-allowed border-gray-200 text-gray-400 opacity-60 bg-gray-50'
        "
      >
        <ng-icon name="bootstrapCurrencyDollar" class="text-lg"></ng-icon>
        <span>Actualizar Precios</span>
      </button>
    </div>

    <div
      class="grid grid-cols-2 gap-3 w-full lg:flex lg:w-auto order-2 lg:order-3 lg:ml-auto"
    >
      <app-products-filter-button
        class="relative col-span-1 sm:w-auto block w-full lg:w-auto"
        [(statusFilter)]="statusFilter"
        [(stockFilter)]="stockFilter"
        [(categoryFilter)]="categoryFilter"
        [categories]="categories()"
      ></app-products-filter-button>

      <div class="col-span-1 sm:w-auto">
        <app-create-entity-button
          label="Producto"
          (clicked)="onAdd.emit()"
        ></app-create-entity-button>
      </div>
    </div>
  </div>
</div>
