<div
  class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-6 mx-4 lg:mx-0"
>
  <h1 class="text-2xl font-bold text-[#3d4494]">Gestión de Productos</h1>

  <div class="flex flex-col lg:flex-row gap-3 w-full lg:w-auto">
    <div class="relative w-full lg:w-60">
      <div
        class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3"
      >
        <ng-icon name="bootstrapSearch" class="text-xl text-gray-400"></ng-icon>
      </div>
      <input
        type="text"
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
        placeholder="Buscar producto..."
        class="block w-full rounded-lg border-0 py-2 pl-10 pr-3 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-[#3d4494] leading-6"
      />
      @if (searchQuery()) {
        <button
          (click)="searchQuery.set('')"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 cursor-pointer"
        >
          <ng-icon name="bootstrapX" class="text-xl"></ng-icon>
        </button>
      }
    </div>

    <div class="flex flex-row gap-2 w-full lg:w-auto">
      <div
        class="relative flex-1 lg:flex-none"
        (clickOutside)="showFilterMenu.set(false)"
      >
        <button
          (click)="toggleMenu()"
          class="cursor-pointer flex w-full lg:w-auto justify-center items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-all"
          [class.ring-2]="hayFiltrosActivos()"
          [class.ring-[#3d4494]]="hayFiltrosActivos()"
          [class.bg-indigo-50]="hayFiltrosActivos()"
        >
          @if (hayFiltrosActivos()) {
            <ng-icon
              name="bootstrapFunnelFill"
              class="text-xl text-[#3d4494]"
            ></ng-icon>
          } @else {
            <ng-icon name="bootstrapFunnel" class="text-xl"></ng-icon>
          }
          <span>Filtros</span>
        </button>

        @if (showFilterMenu()) {
          <div
            class="absolute left-0 lg:left-auto lg:right-0 mt-2 w-72 max-w-[90vw] origin-top-left lg:origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 z-50"
          >
            <div class="p-4 space-y-4">
              <div>
                <h2
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
                >
                  Filtrar por Estado
                </h2>
                <div class="space-y-2">
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="estado"
                      [checked]="statusFilter() === 'Todos'"
                      (change)="statusFilter.set('Todos')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Todos</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="estado"
                      [checked]="statusFilter() === 'Activo'"
                      (change)="statusFilter.set('Activo')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Activos</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="estado"
                      [checked]="statusFilter() === 'Inactivo'"
                      (change)="statusFilter.set('Inactivo')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Inactivos</span>
                  </label>
                </div>
              </div>

              <hr class="border-gray-100" />

              <div>
                <h2
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
                >
                  Filtrar por Stock
                </h2>
                <div class="space-y-2">
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="stock"
                      [checked]="stockFilter() === 'Todos'"
                      (change)="stockFilter.set('Todos')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Todos</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="stock"
                      [checked]="stockFilter() === 'AltoStock'"
                      (change)="stockFilter.set('AltoStock')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Stock alto (+10)</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="stock"
                      [checked]="stockFilter() === 'BajoStock'"
                      (change)="stockFilter.set('BajoStock')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Stock bajo (-10)</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="stock"
                      [checked]="stockFilter() === 'SinStock'"
                      (change)="stockFilter.set('SinStock')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Stock agotado</span>
                  </label>

                  <div class="pt-2 mt-2 border-t border-gray-100"></div>

                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="inv"
                      [checked]="stockFilter() === 'MasProductos'"
                      (change)="stockFilter.set('MasProductos')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Mayor a menor</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="inv"
                      [checked]="stockFilter() === 'MenosProductos'"
                      (change)="stockFilter.set('MenosProductos')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Menor a mayor</span>
                  </label>
                </div>
              </div>

              <button
                (click)="limpiar()"
                class="cursor-pointer w-full mt-2 px-3 py-2 text-xs font-medium text-[#3d4494] bg-indigo-50 rounded hover:bg-indigo-100 transition-colors"
              >
                Limpiar Filtros
              </button>
            </div>
          </div>
        }
      </div>

      @if (hasSelection()) {
        <button
          (click)="onBulkPriceUpdate.emit()"
          class="animate-fadeIn cursor-pointer flex-1 lg:flex-none bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors flex justify-center items-center gap-2 shadow-sm whitespace-nowrap"
        >
          <ng-icon name="bootstrapCurrencyDollar" class="text-xl"></ng-icon>
          <span>Precio</span>
        </button>
      }

      <button
        (click)="onAdd.emit()"
        class="cursor-pointer flex-1 lg:flex-none bg-[#3d4494] text-white px-4 py-2 rounded-lg hover:bg-[#2a2f63] transition-colors flex justify-center items-center gap-2 shadow-sm whitespace-nowrap"
      >
        <ng-icon name="bootstrapPlusLg" class="text-xl"></ng-icon>
        <span>Agregar</span>
        <span class="hidden lg:inline">Producto</span>
      </button>
    </div>
  </div>
</div>
