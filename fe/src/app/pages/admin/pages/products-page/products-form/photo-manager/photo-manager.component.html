<div>
  <label class="block text-sm font-medium text-gray-700 mb-2"
    >Fotos del Producto</label
  >

  <div
    (click)="fileInput.click()"
    class="group flex justify-center rounded-lg border-2 border-dashed border-gray-300 px-6 py-8 hover:bg-gray-50 hover:border-[#3d4494] transition-all cursor-pointer relative"
  >
    <div class="text-center">
      <svg
        class="mx-auto h-12 w-12 text-gray-400 group-hover:text-[#3d4494] transition-colors"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M1.5 6a2.25 2.25 0 012.25-2.25h16.5A2.25 2.25 0 0122.5 6v12a2.25 2.25 0 01-2.25 2.25H3.75A2.25 2.25 0 011.5 18V6zM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0021 18v-1.94l-2.69-2.689a1.5 1.5 0 00-2.12 0l-.88.879.97.97a.75.75 0 11-1.06 1.06l-5.16-5.159a1.5 1.5 0 00-2.12 0L3 16.061zm10.125-7.81a1.125 1.125 0 112.25 0 1.125 1.125 0 01-2.25 0z"
          clip-rule="evenodd"
        />
      </svg>
      <div class="mt-2 text-sm text-gray-600">
        <span class="font-semibold text-[#3d4494]">Haz clic para subir</span> o
        arrastra
      </div>
      <p class="text-xs text-gray-500 mt-1">PNG, JPG hasta 5MB</p>
    </div>
    <input
      #fileInput
      type="file"
      class="hidden"
      multiple
      accept="image/*"
      (change)="onFileSelected($event)"
    />
  </div>

  @if (gallery().length > 0) {
    <div class="mt-6">
      <h3 class="text-sm font-semibold text-gray-500 tracking-wide mb-3">
        Galería ({{ gallery().length }} fotos) - Utiliza las flechas para
        reordenar la secuencia de imágenes.
      </h3>

      <div
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"
      >
        @for (photo of gallery(); track photo.uiId; let i = $index) {
          <div
            class="relative group aspect-square rounded-xl overflow-hidden border border-gray-200 shadow-sm bg-white"
          >
            <img
              [src]="photo.src"
              class="w-full h-full object-cover"
              alt="Producto"
            />

            <span
              class="absolute top-2 left-2 bg-gray-900/60 text-white text-xs font-bold px-2.5 py-1 rounded-lg shadow-sm z-10 backdrop-blur-sm border border-white/20"
            >
              #{{ i + 1 }}
            </span>

            <div
              class="absolute inset-0 bg-black/0 md:group-hover:bg-black/40 transition-all duration-200 p-2 flex flex-col justify-between opacity-100 md:opacity-0 md:group-hover:opacity-100"
            >
              <div class="flex justify-end">
                <button
                  type="button"
                  (click)="removePhoto(i)"
                  class="bg-white/90 text-red-600 p-1.5 rounded-full hover:bg-red-600 hover:text-white transition shadow-sm backdrop-blur-sm"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="size-4"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"
                    />
                  </svg>
                </button>
              </div>
              <div
                class="flex justify-center gap-4 md:justify-between items-center px-1"
              >
                <button
                  type="button"
                  (click)="movePhoto(i, 'left')"
                  [disabled]="i === 0"
                  [class.opacity-30]="i === 0"
                  class="bg-white/90 text-gray-800 p-1.5 rounded-full hover:bg-[#3d4494] hover:text-white transition shadow-sm disabled:cursor-not-allowed backdrop-blur-sm"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="size-4"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15.75 19.5L8.25 12l7.5-7.5"
                    />
                  </svg>
                </button>
                <button
                  type="button"
                  (click)="movePhoto(i, 'right')"
                  [disabled]="i === gallery().length - 1"
                  [class.opacity-30]="i === gallery().length - 1"
                  class="bg-white/90 text-gray-800 p-1.5 rounded-full hover:bg-[#3d4494] hover:text-white transition shadow-sm disabled:cursor-not-allowed backdrop-blur-sm"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    class="size-4"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M8.25 4.5l7.5 7.5-7.5 7.5"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  }
</div>
