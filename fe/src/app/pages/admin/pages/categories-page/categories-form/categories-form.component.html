<div class="animate-fadeIn max-w-3xl mx-auto">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="page-title">
        {{ isEditMode() ? "Editar Categoría" : "Nueva Categoría" }}
      </h1>
    </div>

    <app-go-back-button></app-go-back-button>
  </div>

  <div class="form-card">
    <form [formGroup]="formCategory" (ngSubmit)="onSubmit()" class="form-body">
      <div class="grid grid-cols-1 gap-y-3">
        <div>
          <label for="name" class="form-label">
            Nombre de la categoría <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="name"
            name="name"
            formControlName="name"
            maxlength="50"
            placeholder="Ej: Electrónica, Ropa..."
            class="form-input"
          />
          <app-field-error
            [control]="formCategory.controls.name"
            [maxLength]="50"
            validLabel="Nombre disponible"
          />
        </div>

        <app-category-parent-select
          [control]="parentIdControl"
          [categories]="allCategories()"
          [currentCategoryId]="categoryId()"
          [currentParentId]="currentParentId()"
        />

        <div>
          <label for="description" class="form-label"
            >Descripción (opcional)</label
          >
          <textarea
            id="description"
            name="description"
            formControlName="description"
            rows="4"
            placeholder="Breve descripción de la categoría..."
            maxlength="1000"
            class="form-input"
          ></textarea>
          <app-field-error
            [control]="formCategory.controls.description"
            [maxLength]="1000"
          />
        </div>

        <div class="relative w-full" (clickOutside)="showStateMenu.set(false)">
          <label for="state" class="form-label">
            Estado <span class="text-red-500">*</span>
          </label>

          <button
            type="button"
            id="state"
            (click)="toggleStateMenu()"
            class="select-trigger focus:ring-1"
          >
            <span class="flex items-center gap-3">
              <span
                class="h-2.5 w-2.5 rounded-full"
                [class]="
                  formCategory.get('state')?.value === 'Activo'
                    ? 'bg-green-500'
                    : 'bg-red-500'
                "
              ></span>
              <span class="block truncate">{{
                formCategory.get("state")?.value
              }}</span>
            </span>
            <span class="select-chevron-wrapper">
              <ng-icon
                name="bootstrapChevronDown"
                class="text-gray-400 transition-transform duration-200"
                [class.rotate-180]="showStateMenu()"
              ></ng-icon>
            </span>
          </button>

          @if (showStateMenu()) {
            <ul class="select-dropdown">
              @for (option of ["Activo", "Inactivo"]; track option) {
                <li (click)="selectState(option)" class="select-option">
                  <div class="flex items-center">
                    <span
                      class="h-2.5 w-2.5 rounded-full mr-2"
                      [class]="
                        option === 'Activo' ? 'bg-green-500' : 'bg-red-500'
                      "
                    ></span>
                    <span
                      [class.font-semibold]="
                        formCategory.get('state')?.value === option
                      "
                    >
                      {{ option }}
                    </span>
                  </div>
                  @if (formCategory.get("state")?.value === option) {
                    <span
                      class="absolute inset-y-0 right-0 flex items-center pr-4"
                    >
                      <ng-icon
                        name="bootstrapCheckLg"
                        class="text-lg"
                      ></ng-icon>
                    </span>
                  }
                </li>
              }
            </ul>
          }
          <app-field-error [control]="formCategory.controls.state" />
        </div>
      </div>

      @if (isEditMode()) {
        <app-audit-info
          [createdAt]="auditCreatedAt()"
          [updatedAt]="auditUpdatedAt()"
          [isActive]="initialState() === 'Activo'"
          [statusDate]="auditStatusDate()"
        />
      }

      <div class="form-footer">
        <button type="button" (click)="onCancel()" class="btn-secondary">
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="!formCategory.valid || !hasRealChanges"
          class="btn-primary"
        >
          {{ isEditMode() ? "Guardar Cambios" : "Crear Categoría" }}
        </button>
      </div>
    </form>
  </div>
</div>
