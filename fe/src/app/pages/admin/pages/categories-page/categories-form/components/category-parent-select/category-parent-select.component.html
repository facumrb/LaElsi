<div class="relative w-full" (clickOutside)="showParentMenu.set(false)">
  <label for="parentId" class="form-label"> Categoría Padre (opcional) </label>

  <button
    type="button"
    id="parentId"
    (click)="toggleParentMenu()"
    class="select-trigger focus:ring-1"
  >
    <span class="flex items-center gap-3">
      <span class="block truncate">{{ parentName() }}</span>
    </span>
    <span class="select-chevron-wrapper">
      <ng-icon
        name="bootstrapChevronDown"
        class="text-gray-400 transition-transform duration-200"
        [class.rotate-180]="showParentMenu()"
      ></ng-icon>
    </span>
  </button>

  @if (showParentMenu()) {
    <ul class="select-dropdown">
      <li (click)="selectParent(null)" class="select-option">
        <div class="flex items-center gap-2">
          <span
            class="font-bold"
            [class.text-gray-900]="control().value !== null"
            [class.text-indigo-700]="control().value === null"
          >
            Ninguna (Categoría Raíz)
          </span>
        </div>
        @if (control().value === null) {
          <span class="absolute inset-y-0 right-0 flex items-center pr-4">
            <ng-icon
              name="bootstrapCheckLg"
              class="text-lg text-indigo-600"
            ></ng-icon>
          </span>
        }
      </li>

      <li class="border-b border-dashed border-gray-300"></li>
      @for (cat of eligibleParents(); track cat.id) {
        <li
          (click)="selectParent(cat.id)"
          class="relative cursor-pointer select-none py-2 pr-9 text-gray-900 hover:bg-gray-100 transition-colors"
          [style.padding-left.rem]="0.75 + (cat.depth || 0) * 1"
        >
          <div class="flex items-center gap-2">
            @if (cat.depth && cat.depth > 0) {
              <span class="text-gray-300">↳</span>
            }
            <span
              class="block truncate"
              [class.font-bold]="!cat.depth"
              [class.font-normal]="cat.depth && cat.depth > 0"
              [class.text-[#3d4494]]="control().value === cat.id"
            >
              {{ cat.name }}
            </span>
          </div>
          @if (control().value === cat.id) {
            <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-[#3d4494]">
              <ng-icon
                name="bootstrapCheckLg"
                class="text-lg"
              ></ng-icon>
            </span>
          }
        </li>
      }
    </ul>
  }
  <app-field-error [control]="control()" />
</div>
