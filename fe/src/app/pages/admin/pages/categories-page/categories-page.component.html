<div class="animate-fadeIn container mx-auto">
  <app-categories-toolbar
    [(searchQuery)]="searchQuery"
    [(statusFilter)]="statusFilter"
    [(stockFilter)]="stockFilter"
    (onAdd)="handleNavigateToCreate()"
    (onOrderChange)="loadCategories()"
  />

  <app-categories-list
    class="mt-6 block"
    [categories]="categoriesFiltered()"
    [isFilterActive]="filtersActive()"
    (onEdit)="handleNavigateToEdit($event)"
    (onDelete)="handleDelete($event)"
  />

  @if (categoryToDelete()) {
    <app-confirm-delete-modal
      [entityName]="categoryToDelete()!.name"
      entityType="categoría"
      [canDeactivate]="true"
      [isDeactivated]="categoryToDelete()!.state === 'Inactivo'"
      (confirmDelete)="confirmDeleteCategory()"
      (confirmDeactivate)="confirmDeactivateCategory()"
      (close)="categoryToDelete.set(null)"
    />
  }
</div>
