<div
  class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-6 mx-4 lg:mx-0"
>
  <h1 class="text-2xl font-bold text-[#3d4494]">Gestión de Categorías</h1>

  <div class="flex flex-col lg:flex-row gap-3 w-full lg:w-auto">
    <div class="w-full lg:w-72">
      <app-search-input [(query)]="searchQuery" placeholder="Buscar categoría..."></app-search-input>
    </div>

    <div class="grid grid-cols-2 gap-3 w-full lg:flex lg:w-auto">
      <div
        class="relative col-span-1 lg:w-auto"
        (clickOutside)="showFilterMenu.set(false)"
      >
        <app-filter-button
          [isActive]="hayFiltrosActivos()"
          [(isOpen)]="showFilterMenu"
        ></app-filter-button>

        @if (showFilterMenu()) {
          <div
            class="absolute left-0 lg:left-auto lg:right-0 mt-2 w-72 max-w-[90vw] origin-top-left lg:origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 z-50"
          >
            <div class="p-4 space-y-4">
              <div>
                <h2
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
                >
                  Filtrar por Estado
                </h2>
                <div class="space-y-2">
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="estado"
                      [checked]="statusFilter() === 'Todos'"
                      (change)="statusFilter.set('Todos')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Todos</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="estado"
                      [checked]="statusFilter() === 'Activo'"
                      (change)="statusFilter.set('Activo')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Activos</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="estado"
                      [checked]="statusFilter() === 'Inactivo'"
                      (change)="statusFilter.set('Inactivo')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Inactivos</span>
                  </label>
                </div>
              </div>

              <hr class="border-gray-100" />

              <div>
                <h2
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
                >
                  Filtrar por Cantidad de Productos
                </h2>
                <div class="space-y-2">
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="inv"
                      [checked]="stockFilter() === 'Todos'"
                      (change)="stockFilter.set('Todos')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Todos</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="inv"
                      [checked]="stockFilter() === 'ConProductos'"
                      (change)="stockFilter.set('ConProductos')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700"
                      >Con productos asociados</span
                    >
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="inv"
                      [checked]="stockFilter() === 'SinProductos'"
                      (change)="stockFilter.set('SinProductos')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700"
                      >Sin productos asociados</span
                    >
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="inv"
                      [checked]="stockFilter() === 'MasProductos'"
                      (change)="stockFilter.set('MasProductos')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Mayor a menor</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="inv"
                      [checked]="stockFilter() === 'MenosProductos'"
                      (change)="stockFilter.set('MenosProductos')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Menor a mayor</span>
                  </label>
                </div>
              </div>

              <button
                (click)="limpiar()"
                class="cursor-pointer w-full mt-2 px-3 h-10 text-xs font-medium text-[#3d4494] bg-indigo-50 rounded hover:bg-indigo-100 transition-colors"
              >
                Limpiar Filtros
              </button>
            </div>
          </div>
        }
      </div>

      <button
        (click)="onAdd.emit()"
        class="cursor-pointer col-span-1 lg:w-auto bg-[#3d4494] text-white px-4 h-10 rounded-lg hover:bg-[#2a2f63] transition-colors flex justify-center items-center gap-2 shadow-sm whitespace-nowrap"
      >
        <ng-icon name="bootstrapPlusLg" class="text-xl shrink-0"></ng-icon>
        <span>Agregar</span>
        <span class="hidden sm:inline">Categoría</span>
      </button>
    </div>
  </div>
</div>
