<div class="animate-fadeIn max-w-4xl mx-auto">
  <!-- Header -->
  <div class="mb-5 flex items-center justify-between">
    <div>
      <h1 class="page-title">Editar Mi Perfil</h1>
    </div>
    <app-go-back-button />
  </div>

  <div class="form-card">
    <form [formGroup]="formEditProfile" (ngSubmit)="onSubmit()" class="form-body">
      <!-- Photo Selection -->
      <div class="mb-4 pb-6 border-b border-gray-50">
        <h2 class="form-section-title">Foto de Perfil</h2>
        <div class="flex flex-col md:flex-row items-center gap-10">
          <div class="w-full md:w-auto">
            <app-photo-manager
              [currentPhoto]="currentPhoto()"
              [userFullName]="
                formEditProfile.get('name')?.value +
                ' ' +
                formEditProfile.get('lastName')?.value
              "
            ></app-photo-manager>
          </div>
          <div class="grow max-w-md">
            <p class="text-gray-500 text-sm leading-relaxed">
              Sube una imagen cuadrada profesional para tu cuenta. Esta foto
              será visible en el panel lateral y en tus registros
              administrativos.
            </p>
          </div>
        </div>
      </div>

      <div class="mb-2">
        <h2 class="form-section-title">Información de Contacto</h2>
        <div class="form-grid-2">
          <!-- Name -->
          <div>
            <label for="name" class="form-label">
              Nombre <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="name"
              name="name"
              formControlName="name"
              minlength="2"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Juan"
            />
            <app-field-error [control]="formEditProfile.controls.name" />
          </div>

          <!-- Last Name -->
          <div>
            <label for="lastName" class="form-label">
              Apellido <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              formControlName="lastName"
              minlength="2"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Perez"
            />
            <app-field-error [control]="formEditProfile.controls.lastName" />
          </div>

          <!-- DNI -->
          <div>
            <label for="dni" class="form-label">
              DNI <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="dni"
              name="dni"
              formControlName="dni"
              minlength="7"
              maxlength="15"
              inputmode="numeric"
              appNumericInput
              class="form-input"
              placeholder="Ej: 12345678"
            />
            <app-field-error
              [control]="formEditProfile.controls.dni"
              validLabel="DNI disponible"
            />
          </div>

          <!-- Phone -->
          <div>
            <label for="phone" class="form-label">
              Teléfono <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="phone"
              name="phone"
              formControlName="phone"
              minlength="7"
              maxlength="20"
              inputmode="tel"
              appPhoneInput
              class="form-input"
              placeholder="Ej: 3415555555"
            />
            <app-field-error [control]="formEditProfile.controls.phone" />
          </div>
        </div>
      </div>

      <div class="mb-6">
        <h2 class="form-section-title">Credenciales de Acceso</h2>
        <div class="form-grid-2">
          <!-- Username -->
          <div>
            <label for="username" class="form-label">
              Nombre de Usuario <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="username"
              name="username"
              formControlName="username"
              minlength="4"
              maxlength="30"
              class="form-input"
              placeholder="Ej: jperez"
            />
            <app-field-error
              [control]="formEditProfile.controls.username"
              validLabel="Usuario disponible"
            />
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="form-label">
              Email <span class="text-red-500">*</span>
            </label>
            <input
              type="email"
              id="email"
              name="email"
              formControlName="email"
              inputmode="email"
              maxlength="255"
              class="form-input"
              placeholder="Ej: juan@ejemplo.com"
            />
            <app-field-error
              [control]="formEditProfile.controls.email"
              validLabel="Email disponible"
            />
          </div>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="form-footer">
        <button type="button" routerLink="/admin/view-profile" class="btn-secondary">
          Cancelar
        </button>

        <button
          type="submit"
          [disabled]="formEditProfile.invalid || !hasRealChanges || formPending"
          class="btn-primary px-8"
        >
          Actualizar Perfil
        </button>
      </div>
    </form>
  </div>
</div>
