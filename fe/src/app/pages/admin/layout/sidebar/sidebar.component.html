<div
  class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm transition-opacity duration-300 lg:hidden"
  [class.opacity-0]="!mobileMenuOpen()"
  [class.invisible]="!mobileMenuOpen()"
  [class.pointer-events-none]="!mobileMenuOpen()"
  [class.opacity-100]="mobileMenuOpen()"
  [class.visible]="mobileMenuOpen()"
  (click)="toggleMobileMenu.emit()"
  aria-hidden="true"
></div>

<aside
  [cdkTrapFocus]="mobileMenuOpen()"
  [cdkTrapFocusAutoCapture]="mobileMenuOpen()"
  id="mobile-menu"
  class="fixed inset-y-0 left-0 z-50 w-64 max-w-[85vw] bg-slate-900 text-white shadow-2xl transition-transform duration-300 lg:hidden flex flex-col"
  [class.-translate-x-full]="!mobileMenuOpen()"
  [class.translate-x-0]="mobileMenuOpen()"
  role="dialog"
  aria-modal="true"
  aria-label="Menú de navegación móvil"
>
  <div
    class="h-16 flex items-center justify-center px-4 bg-slate-950 border-b border-slate-800 shrink-0"
  >
    <span class="font-bold text-xl uppercase tracking-wider">Laelsi</span>
  </div>

  <nav class="flex-1 overflow-y-auto py-6 flex flex-col gap-1 px-3">
    @for (item of menuItems; track item.label) {
      <a
        [routerLink]="item.route"
        (click)="toggleMobileMenu.emit()"
        routerLinkActive="active bg-indigo-600 text-white shadow-md"
        class="flex items-center p-3 h-12 rounded-md [&:not(.active)]:hover:bg-slate-800 transition-colors text-slate-300"
      >
        <ng-icon [name]="item.icon" class="text-xl mr-3"></ng-icon>
        <span class="font-medium">{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>

<aside
  id="desktop-sidebar"
  class="hidden lg:flex flex-col bg-slate-900 text-slate-300 transition-all duration-300 ease-in-out shadow-xl z-10 shrink-0"
  [class.w-64]="sidebarOpen()"
  [class.w-20]="!sidebarOpen()"
>
  <div
    class="h-16 bg-slate-950 text-white overflow-hidden whitespace-nowrap border-b border-slate-800 shrink-0 relative"
  >
    <div
      class="w-64 h-full flex items-center justify-center absolute top-0 left-0"
    >
      <span
        class="font-bold text-xl uppercase tracking-wider transition-opacity duration-200"
        [class.opacity-0]="!sidebarOpen()"
      >
        Laelsi
      </span>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto py-6 flex flex-col gap-1 px-3">
    @for (item of menuItems; track item.label) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active bg-indigo-600 text-white shadow-md"
        class="flex items-center h-12 rounded-md [&:not(.active)]:hover:bg-slate-800 [&:not(.active)]:hover:text-white transition-all group relative overflow-hidden"
        [title]="!sidebarOpen() ? item.label : ''"
      >
        <div class="w-14 flex items-center justify-center shrink-0">
          <ng-icon [name]="item.icon" class="text-xl"></ng-icon>
        </div>

        <span
          class="font-medium whitespace-nowrap transition-opacity duration-200"
          [class.opacity-0]="!sidebarOpen()"
        >
          {{ item.label }}
        </span>

        @if (!sidebarOpen()) {
          <div
            class="absolute left-16 bg-slate-900 text-white text-xs px-2 py-1.5 rounded opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-opacity z-50 pointer-events-none whitespace-nowrap shadow-xl border border-slate-700"
          >
            {{ item.label }}
          </div>
        }
      </a>
    }
  </nav>
</aside>
