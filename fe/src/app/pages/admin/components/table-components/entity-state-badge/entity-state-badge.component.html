<span
  role="status"
  [attr.aria-label]="'Estado: ' + state()"
  class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border"
  [class]="badgeClass()"
  [class.lg:hidden]="mode() === 'card'"
>
  <span class="w-1.5 h-1.5 rounded-full mr-1.5" [class]="dotClass()"></span>
  {{ state() }}
</span>
