<div class="flex h-screen bg-gray-50 font-sans overflow-hidden">
  <div
    class="fixed inset-0 z-20 bg-black/50 backdrop-blur-sm transition-opacity duration-300 md:hidden"
    [class.opacity-0]="!mobileMenuOpen()"
    [class.pointer-events-none]="!mobileMenuOpen()"
    (click)="toggleMobileMenu()"
  ></div>

  <aside
    id="mobile-menu"
    class="fixed inset-y-0 left-0 z-30 w-64 max-w-[85vw] bg-slate-900 text-white transform transition-transform duration-300 ease-in-out"
    [class.-translate-x-full]="!mobileMenuOpen()"
  >
    <div
      class="text-xl h-16 flex items-center justify-center bg-slate-950 font-bold tracking-widest border-b border-slate-800"
    >
      LAELSI
    </div>

    <nav class="p-4 space-y-2">
      @for (item of menuItems; track item.label) {
        <a
          [routerLink]="item.route"
          (click)="toggleMobileMenu()"
          routerLinkActive="bg-indigo-600 text-white shadow-md"
          class="flex items-center p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-300"
        >
          <ng-icon [name]="item.icon" class="text-xl mr-3"></ng-icon>
          <span class="font-medium">{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <aside
    id="desktop-sidebar"
    class="hidden md:flex flex-col bg-slate-900 text-slate-300 transition-all duration-300 ease-in-out shadow-xl z-10"
    [class.w-64]="sidebarOpen()"
    [class.w-20]="!sidebarOpen()"
  >
    <div
      class="h-16 flex items-center justify-center bg-slate-950 text-white overflow-hidden whitespace-nowrap border-b border-slate-800"
    >
      @if (sidebarOpen()) {
        <span class="font-bold text-xl tracking-wider">LAELSI</span>
      }
    </div>

    <nav class="flex-1 py-6 flex flex-col gap-1 px-3">
      @for (item of menuItems; track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-indigo-600 text-white"
          class="flex items-center p-3 rounded-md hover:bg-slate-800 hover:text-white transition-colors group relative"
          [class.justify-center]="!sidebarOpen()"
        >
          <ng-icon
            [name]="item.icon"
            class="text-xl shrink-0 transition-all duration-300"
            [class.mr-3]="sidebarOpen()"
          ></ng-icon>

          <span
            class="font-medium whitespace-nowrap overflow-hidden transition-all duration-300"
            [class.opacity-0]="!sidebarOpen()"
            [class.w-0]="!sidebarOpen()"
          >
            {{ item.label }}
          </span>

          @if (!sidebarOpen()) {
            <div
              class="absolute left-14 bg-slate-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity z-50 pointer-events-none whitespace-nowrap shadow-lg"
            >
              {{ item.label }}
            </div>
          }
        </a>
      }
    </nav>
  </aside>

  <main class="flex-1 flex flex-col h-full overflow-hidden">
    <header
      class="h-16 bg-white shadow-sm border-b flex items-center justify-between px-4 z-10"
    >
      <div class="flex items-center gap-2">
        <button
          (click)="toggleMobileMenu()"
          aria-controls="mobile-menu"
          [attr.aria-expanded]="mobileMenuOpen()"
          aria-label="Alternar menú de navegación móvil"
          class="md:hidden p-2 rounded hover:bg-gray-100 flex items-center justify-center text-gray-600 focus:outline-none focus:ring-2 focus:ring-[#3d4494]"
        >
          <ng-icon
            name="bootstrapList"
            class="text-2xl"
            aria-hidden="true"
          ></ng-icon>
        </button>

        <button
          (click)="toggleSidebar()"
          aria-controls="desktop-sidebar"
          [attr.aria-expanded]="sidebarOpen()"
          aria-label="Alternar barra lateral"
          class="cursor-pointer hidden md:flex p-2 rounded hover:bg-gray-100 text-gray-600 items-center justify-center focus:outline-none focus:ring-2 focus:ring-[#3d4494]"
        >
          <ng-icon
            name="bootstrapList"
            class="text-2xl"
            aria-hidden="true"
          ></ng-icon>
        </button>
      </div>

      <div class="flex items-center gap-4">
        <a
          routerLink="/"
          class="flex items-center gap-2 text-sm font-semibold text-gray-600 hover:text-indigo-600 px-3 py-1.5 rounded-md border border-gray-200 hover:bg-gray-50 transition-colors mr-2"
          title="Ir a la tienda pública"
        >
          <ng-icon name="bootstrapShop" class="text-lg"></ng-icon>
          <span>Ver Tienda</span>
        </a>

        <div class="relative" (clickOutside)="showUserMenu.set(false)">
          <button
            id="user-menu-button"
            (click)="toggleUserMenu()"
            aria-haspopup="true"
            aria-controls="user-menu-dropdown"
            [attr.aria-expanded]="showUserMenu()"
            [attr.aria-label]="
              'Abrir menú de usuario de ' + (currentUser()?.name || 'tu cuenta')
            "
            class="cursor-pointer flex items-center space-x-2 focus:outline-none focus:ring-2 focus:ring-[#3d4494] rounded-full md:rounded-md pr-2"
          >
            @if (currentUser()?.photo) {
              <img
                [src]="imageBaseUrl + currentUser()!.photo!.fileName"
                alt=""
                aria-hidden="true"
                class="w-9 h-9 rounded-full object-cover border border-gray-200"
              />
            } @else {
              <div
                aria-hidden="true"
                class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold border border-indigo-200 text-sm"
              >
                {{ getUserInitials() }}
              </div>
            }

            <span
              class="hidden md:block text-sm font-medium text-gray-700"
              aria-hidden="true"
            >
              {{ currentUser()?.name }}
            </span>
          </button>

          @if (showUserMenu()) {
            <div
              id="user-menu-dropdown"
              role="menu"
              aria-labelledby="user-menu-button"
              class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 border border-gray-100 animate-in fade-in slide-in-from-top-1 duration-200 z-20"
            >
              @if (currentUser(); as user) {
                <a
                  [routerLink]="['/admin/view-profile', user.id]"
                  (click)="showUserMenu.set(false)"
                  role="menuitem"
                  class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#3d4494]"
                >
                  <ng-icon
                    name="bootstrapPerson"
                    class="text-lg"
                    aria-hidden="true"
                  ></ng-icon>
                  Mi Perfil
                </a>
              }
              <button
                (click)="handleLogout()"
                role="menuitem"
                class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-50 cursor-pointer flex items-center gap-2"
              >
                <ng-icon
                  name="bootstrapBoxArrowRight"
                  class="text-lg"
                  aria-hidden="true"
                ></ng-icon>
                Cerrar Sesión
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <div class="flex-1 overflow-auto p-4 md:p-6 lg:p-8">
      <router-outlet />
    </div>
  </main>
</div>
