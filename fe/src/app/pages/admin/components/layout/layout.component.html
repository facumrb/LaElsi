<div class="flex h-screen bg-gray-50 font-sans overflow-hidden">
  @if (mobileMenuOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm transition-opacity md:hidden"
      (click)="toggleMobileMenu()"
      aria-hidden="true"
    ></div>

    <aside
      id="mobile-menu"
      class="fixed inset-y-0 left-0 z-50 w-64 max-w-[85vw] bg-slate-900 text-white shadow-2xl transition-transform duration-300 md:hidden flex flex-col"
      role="dialog"
      aria-modal="true"
      aria-label="Menú de navegación móvil"
    >
      <div
        class="h-16 flex items-center justify-center px-4 bg-slate-950 border-b border-slate-800 shrink-0"
      >
        <span class="text-xl font-bold tracking-widest text-white">LAELSI</span>
      </div>

      <nav class="flex-1 overflow-y-auto p-4 space-y-2">
        @for (item of menuItems; track item.label) {
          <a
            [routerLink]="item.route"
            (click)="toggleMobileMenu()"
            routerLinkActive="bg-indigo-600 text-white shadow-md"
            class="flex items-center p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-300"
          >
            <ng-icon [name]="item.icon" class="text-xl mr-3"></ng-icon>
            <span class="font-medium">{{ item.label }}</span>
          </a>
        }
      </nav>
    </aside>
  }

  <aside
    id="desktop-sidebar"
    class="hidden md:flex flex-col bg-slate-900 text-slate-300 transition-all duration-300 ease-in-out shadow-xl z-10 shrink-0"
    [class.w-64]="sidebarOpen()"
    [class.w-20]="!sidebarOpen()"
  >
    <div
      class="h-16 flex items-center justify-center bg-slate-950 text-white overflow-hidden whitespace-nowrap border-b border-slate-800 shrink-0 transition-all"
    >
      @if (sidebarOpen()) {
        <span
          class="font-bold text-xl tracking-wider animate-in fade-in duration-300"
          >LAELSI</span
        >
      }
    </div>

    <nav class="flex-1 overflow-y-auto py-6 flex flex-col gap-1 px-3">
      @for (item of menuItems; track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-indigo-600 text-white shadow-md"
          class="flex items-center p-3 rounded-md hover:bg-slate-800 hover:text-white transition-all group relative overflow-hidden"
          [class.justify-center]="!sidebarOpen()"
          [title]="!sidebarOpen() ? item.label : ''"
        >
          <ng-icon
            [name]="item.icon"
            class="text-xl shrink-0 transition-all duration-300"
            [class.mr-3]="sidebarOpen()"
          ></ng-icon>

          <span
            class="font-medium whitespace-nowrap transition-all duration-300 origin-left"
            [class.opacity-0]="!sidebarOpen()"
            [class.w-0]="!sidebarOpen()"
            [class.hidden]="!sidebarOpen()"
          >
            {{ item.label }}
          </span>

          @if (!sidebarOpen()) {
            <div
              class="absolute left-16 bg-slate-900 text-white text-xs px-2 py-1.5 rounded opacity-0 group-hover:opacity-100 transition-opacity z-50 pointer-events-none whitespace-nowrap shadow-xl border border-slate-700"
            >
              {{ item.label }}
            </div>
          }
        </a>
      }
    </nav>
  </aside>

  <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full">
    <header
      class="h-16 bg-white shadow-sm border-b flex items-center justify-between px-4 z-20 shrink-0"
    >
      <div class="flex items-center gap-2">
        <button
          (click)="toggleMobileMenu()"
          class="cursor-pointer md:hidden h-10 w-10 rounded-lg hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-[#3d4494]"
          aria-label="Abrir menú"
        >
          <ng-icon name="bootstrapList" class="text-2xl"></ng-icon>
        </button>

        <button
          (click)="toggleSidebar()"
          class="hidden md:flex h-10 w-10 cursor-pointer rounded-lg hover:bg-gray-100 text-gray-600 items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-[#3d4494]"
          aria-label="Colapsar menú lateral"
        >
          <ng-icon name="bootstrapList" class="text-2xl"></ng-icon>
        </button>
      </div>

      <div class="flex items-center gap-4">
        <a
          routerLink="/"
          class="group cursor-pointer flex items-center gap-3 pl-1 pr-4 py-1 rounded-full border border-gray-200 bg-white/5 hover:bg-gray-50 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500"
          title="Ir a la tienda pública"
        >
          <div
            class="h-8 w-8 rounded-full bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 group-hover:bg-indigo-100 transition-colors"
          >
            <ng-icon name="bootstrapShop" class="text-lg"></ng-icon>
          </div>

          <span class="text-sm font-medium text-gray-600"> Ver Tienda </span>
        </a>

        <div class="relative" (clickOutside)="showUserMenu.set(false)">
          <button
            (click)="toggleUserMenu()"
            class="group cursor-pointer flex items-center gap-3 pl-1 pr-4 py-1 rounded-full border border-gray-200 bg-white/5 hover:bg-gray-50 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <div
              class="h-8 w-8 rounded-full overflow-hidden bg-[#5a2a8a] flex items-center justify-center border border-white/30 text-white shadow-sm"
            >
              @if (currentUser()?.photo) {
                <img
                  [src]="imageBaseUrl + currentUser()!.photo!.fileName"
                  alt="Avatar"
                  class="h-full w-full object-cover"
                />
              } @else {
                <span class="text-xs font-bold tracking-widest">
                  {{ getUserInitials() }}
                </span>
              }
            </div>

            <div class="flex items-center gap-2">
              <span class="text-sm font-medium max-w-25 text-gray-600 truncate">
                {{ currentUser()?.name }}
              </span>
              <ng-icon
                name="bootstrapChevronDown"
                class="text-xs text-gray-400 transition-transform duration-200 group-hover:text-gray-600"
                [class.rotate-180]="showUserMenu()"
              ></ng-icon>
            </div>
          </button>

          @if (showUserMenu()) {
            <div
              class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl py-2 z-50 animate-in fade-in slide-in-from-top-1 origin-top-right border border-gray-100"
            >
              <a
                [routerLink]="['/admin/view-profile', currentUser()?.id]"
                (click)="showUserMenu.set(false)"
                class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition-colors"
                ><ng-icon name="bootstrapPerson" class="text-lg"></ng-icon> Mi
                Perfil</a
              >
              <div class="border-t border-gray-100 my-1 hidden md:block"></div>
              <button
                (click)="handleLogout()"
                class="cursor-pointer w-full text-left flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-gray-50 transition-colors"
              >
                <ng-icon
                  name="bootstrapBoxArrowRight"
                  class="text-lg"
                ></ng-icon>
                Cerrar Sesión
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <div
      class="flex-1 overflow-auto p-4 md:p-6 lg:p-8 bg-gray-50 relative w-full"
    >
      <router-outlet />
    </div>
  </main>
</div>
