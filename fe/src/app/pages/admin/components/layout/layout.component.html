<div class="flex h-screen bg-gray-50 font-sans overflow-hidden">
  <div
    class="fixed inset-0 z-20 bg-black/50 backdrop-blur-sm transition-opacity duration-300 md:hidden"
    [class.opacity-0]="!mobileMenuOpen()"
    [class.pointer-events-none]="!mobileMenuOpen()"
    (click)="toggleMobileMenu()"
  ></div>

  <aside
    class="fixed inset-y-0 left-0 z-30 w-64 max-w-[85vw] bg-slate-900 text-white transform transition-transform duration-300 ease-in-out"
    [class.-translate-x-full]="!mobileMenuOpen()"
  >
    <div
      class="text-xl h-16 flex items-center justify-center bg-slate-950 font-bold tracking-widest border-b border-slate-800"
    >
      LAELSI
    </div>

    <nav class="p-4 space-y-2">
      @for (item of menuItems; track item.label) {
        <a
          [routerLink]="item.route"
          (click)="toggleMobileMenu()"
          routerLinkActive="bg-indigo-600 text-white shadow-md"
          class="flex items-center p-3 rounded-lg hover:bg-slate-800 transition-colors text-slate-300"
        >
          <ng-icon [name]="item.icon" class="text-xl mr-3"></ng-icon>
          <span class="font-medium">{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <aside
    class="hidden md:flex flex-col bg-slate-900 text-slate-300 transition-all duration-300 ease-in-out shadow-xl z-10"
    [class.w-64]="sidebarOpen()"
    [class.w-20]="!sidebarOpen()"
  >
    <div
      class="h-16 flex items-center justify-center bg-slate-950 text-white overflow-hidden whitespace-nowrap border-b border-slate-800"
    >
      @if (sidebarOpen()) {
        <span class="font-bold text-xl tracking-wider">LAELSI</span>
      }
    </div>

    <nav class="flex-1 py-6 flex flex-col gap-1 px-3">
      @for (item of menuItems; track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-indigo-600 text-white"
          class="flex items-center p-3 rounded-md hover:bg-slate-800 hover:text-white transition-colors group relative"
          [class.justify-center]="!sidebarOpen()"
        >
          <ng-icon
            [name]="item.icon"
            class="text-xl shrink-0 transition-all duration-300"
            [class.mr-3]="sidebarOpen()"
          ></ng-icon>

          <span
            class="font-medium whitespace-nowrap overflow-hidden transition-all duration-300"
            [class.opacity-0]="!sidebarOpen()"
            [class.w-0]="!sidebarOpen()"
          >
            {{ item.label }}
          </span>

          @if (!sidebarOpen()) {
            <div
              class="absolute left-14 bg-slate-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity z-50 pointer-events-none whitespace-nowrap shadow-lg"
            >
              {{ item.label }}
            </div>
          }
        </a>
      }
    </nav>
  </aside>

  <main class="flex-1 flex flex-col h-full overflow-hidden">
    <header
      class="h-16 bg-white shadow-sm border-b flex items-center justify-between px-4 z-10"
    >
      <div class="flex items-center gap-2">
        <button
          (click)="toggleMobileMenu()"
          class="md:hidden p-2 rounded hover:bg-gray-100 flex items-center justify-center text-gray-600"
        >
          <ng-icon name="bootstrapList" class="text-2xl"></ng-icon>
        </button>

        <button
          (click)="toggleSidebar()"
          class="cursor-pointer hidden md:flex p-2 rounded hover:bg-gray-100 text-gray-600 items-center justify-center"
        >
          <ng-icon name="bootstrapList" class="text-2xl"></ng-icon>
        </button>
      </div>

      <div class="relative" (clickOutside)="showUserMenu.set(false)">
        <button
          (click)="toggleUserMenu()"
          class="cursor-pointer flex items-center space-x-2 focus:outline-none"
        >
          <div
            class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold border border-indigo-200"
          >
            {{ currentUser()?.name?.charAt(0) }}
          </div>
          <span class="hidden md:block text-sm font-medium text-gray-700">
            {{ currentUser()?.name }}
          </span>
        </button>

        @if (showUserMenu()) {
          <div
            class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 border border-gray-100 animate-in fade-in slide-in-from-top-1 duration-200 z-20"
          >
            @if (currentUser(); as user) {
              <a
                [routerLink]="['/admin/view-profile', user.id]"
                (click)="showUserMenu.set(false)"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 cursor-pointer"
              >
                Ver Perfil
              </a>
            }
            <button
              (click)="handleLogout()"
              class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-50 cursor-pointer"
            >
              Cerrar Sesión
            </button>
          </div>
        }
      </div>
    </header>

    <div class="flex-1 overflow-auto p-4 md:p-6 lg:p-8">
      <router-outlet />
    </div>
  </main>
</div>
