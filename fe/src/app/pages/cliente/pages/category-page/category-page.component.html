<div class="container mx-auto p-6">
  <header class="mb-10 border-b-2 border-[#f4abac] pb-4">
    <h1 class="text-4xl font-extrabold text-gray-900 uppercase">
      Sección:
      <span class="text-[#f4abac]">{{ categoria?.nombre }}</span>
    </h1>
  </header>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
    @for (item of items; track item.id) {
      <app-item-card [product]="item"></app-item-card>
    } @empty {
      <p class="text-gray-400">No hay productos en esta categoría.</p>
    }
  </div>
</div>
