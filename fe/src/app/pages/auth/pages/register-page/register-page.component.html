<main class="flex min-h-screen items-center justify-center bg-gray-50 p-4">
  <div class="w-full max-w-xl">
    <div class="mb-4 flex justify-start">
      <app-go-back-button></app-go-back-button>
    </div>

    <div class="rounded-2xl bg-white p-6 md:p-12 shadow-2xl border border-gray-100">
      <div class="mb-6 flex justify-center">
        <app-logo
          [width]="144"
          [height]="48"
          loading="eager"
          customClass="h-16 w-auto object-contain"
        />
      </div>

      <p class="mb-8 text-center text-gray-500 text-sm font-medium uppercase tracking-wider">Crea tu cuenta</p>

      <form
        [formGroup]="formRegister"
        novalidate
        (ngSubmit)="onSubmit()"
        class="space-y-6"
      >
        <!-- Usuario -->
        <div>
          <label for="username" class="mb-2 block text-sm font-bold text-gray-700">
            Nombre de usuario <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="username"
            name="username"
            formControlName="username"
            minlength="4"
            maxlength="30"
            autocomplete="username"
            class="form-input p-3.5 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all rounded-lg border-gray-300"
            placeholder="Ej: jperez"
          />
          <app-field-error
            [control]="formRegister.controls.username"
            [maxLength]="30"
            validLabel="Usuario disponible"
          />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="mb-2 block text-sm font-bold text-gray-700">
            Email <span class="text-red-500">*</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            formControlName="email"
            inputmode="email"
            maxlength="255"
            autocomplete="email"
            class="form-input p-3.5 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all rounded-lg border-gray-300"
            placeholder="Ej: juan@ejemplo.com"
          />
          <app-field-error
            [control]="formRegister.controls.email"
            [maxLength]="255"
            validLabel="Email disponible"
          />
        </div>

        <!-- Contraseña -->
        <div>
          <label for="password" class="mb-2 block text-sm font-bold text-gray-700">
            Contraseña <span class="text-red-500">*</span>
          </label>

          <div class="relative">
            <input
              [type]="passwordVisible() ? 'text' : 'password'"
              id="password"
              name="password"
              formControlName="password"
              maxlength="100"
              autocomplete="new-password"
              class="form-input p-3.5 pr-10 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all rounded-lg border-gray-300"
              placeholder="Mínimo 8 caracteres, 1 letra, 1 número."
            />

            <app-password-toggle-button
              [(visible)]="passwordVisible"
              [show]="showEyeIcon()"
            />
          </div>

          <app-field-error 
            [control]="formRegister.controls.password" 
            [maxLength]="100"
          />
        </div>

        <!-- Confirmar Contraseña -->
        <div>
          <label for="confirmPassword" class="mb-2 block text-sm font-bold text-gray-700">
            Confirmar Contraseña <span class="text-red-500">*</span>
          </label>

          <div class="relative">
            <input
              [type]="passwordVisible() ? 'text' : 'password'"
              id="confirmPassword"
              name="confirmPassword"
              formControlName="confirmPassword"
              maxlength="100"
              autocomplete="new-password"
              class="form-input p-3.5 pr-10 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all rounded-lg border-gray-300"
              placeholder="Repetí tu contraseña"
            />

            <app-password-toggle-button
              [(visible)]="passwordVisible"
              [show]="showEyeIcon()"
            />
          </div>

          <app-field-error [control]="formRegister.controls.confirmPassword" />
        </div>

        <div class="pt-4">
          <button
            type="submit"
            [disabled]="loading() || !isValid() || isPending()"
            class="btn-primary w-full flex justify-center py-4 px-4 shadow-lg hover:shadow-xl focus:ring-2 focus:ring-offset-2 focus:ring-[#3d4494] transform active:scale-[0.98] font-bold text-lg rounded-xl"
          >
            @if (loading() || isPending()) {
              <ng-icon
                name="bootstrapArrowClockwise"
                class="animate-spin text-2xl mr-2"
              ></ng-icon>
            }
            Crear cuenta
          </button>
        </div>

        <div class="mt-8 text-center text-sm text-gray-600">
          ¿Ya tenés cuenta?
          <a
            routerLink="/auth/login"
            class="cursor-pointer font-extrabold text-[#3d4494] hover:text-[#2a2f63] hover:underline transition-colors ml-1"
          >
            Iniciar Sesión
          </a>
        </div>
      </form>
    </div>
  </div>

</main>
