<main class="flex min-h-screen items-start py-8 md:items-center justify-center bg-gray-50 px-4 overflow-y-auto">
  <div class="w-full max-w-lg sm:max-w-xl">
    <div class="mb-4 flex justify-start">
      <app-go-back-button></app-go-back-button>
    </div>

    <div class="rounded-xl bg-white p-8 shadow-xl border border-gray-100">
      <h1 class="mb-4 flex justify-center">
        <app-logo
          [width]="128"
          [height]="48"
          loading="eager"
          customClass="h-14 w-auto object-contain"
        />
        <span class="sr-only">LaElsi</span>
      </h1>

      <p class="mb-6 text-center text-gray-500 text-sm">Crea tu cuenta</p>

      <form
        [formGroup]="formRegister"
        novalidate
        (ngSubmit)="onSubmit()"
        class="space-y-5"
      >
        <!-- Usuario -->
        <div>
          <label for="username" class="mb-1.5 form-label font-semibold">
            Nombre de usuario <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="username"
            name="username"
            formControlName="username"
            minlength="4"
            maxlength="30"
            autocomplete="username"
            class="form-input p-3 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all"
            placeholder="Ej: jperez"
          />
          <app-field-error
            [control]="formRegister.controls.username"
            [maxLength]="30"
            validLabel="Usuario disponible"
          />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="mb-1.5 form-label font-semibold">
            Email <span class="text-red-500">*</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            formControlName="email"
            inputmode="email"
            maxlength="255"
            autocomplete="email"
            class="form-input p-3 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all"
            placeholder="Ej: juan@ejemplo.com"
          />
          <app-field-error
            [control]="formRegister.controls.email"
            [maxLength]="255"
            validLabel="Email disponible"
          />
        </div>

        <!-- Contraseña -->
        <div>
          <label for="password" class="mb-1.5 form-label font-semibold">
            Contraseña <span class="text-red-500">*</span>
          </label>

          <div class="relative">
            <input
              [type]="passwordVisible() ? 'text' : 'password'"
              id="password"
              name="password"
              formControlName="password"
              maxlength="100"
              autocomplete="new-password"
              class="form-input p-3 pr-10 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all"
              placeholder="••••••••"
            />

            <app-password-toggle-button
              [(visible)]="passwordVisible"
              [show]="showEyeIcon()"
            />
          </div>

          <app-field-error 
            [control]="formRegister.controls.password" 
            [maxLength]="100"
          />
        </div>

        <!-- Confirmar Contraseña -->
        <div>
          <label for="confirmPassword" class="mb-1.5 form-label font-semibold">
            Confirmar Contraseña <span class="text-red-500">*</span>
          </label>

          <div class="relative">
            <input
              [type]="confirmPasswordVisible() ? 'text' : 'password'"
              id="confirmPassword"
              name="confirmPassword"
              formControlName="confirmPassword"
              maxlength="100"
              autocomplete="new-password"
              class="form-input p-3 pr-10 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all"
              placeholder="Repetí tu contraseña"
            />

            <app-password-toggle-button
              [(visible)]="confirmPasswordVisible"
              [show]="showConfirmEyeIcon()"
            />
          </div>

          <app-field-error [control]="formRegister.controls.confirmPassword" />
          @if (formRegister.errors?.['passwordsNotEqual'] && (formRegister.controls.confirmPassword.touched || formRegister.controls.confirmPassword.dirty)) {
            <div class="mt-1 text-xs text-red-600">Las contraseñas no coinciden.</div>
          }
        </div>

        <div class="pt-2">
          <button
            type="submit"
            [disabled]="loading() || !isValid() || isPending()"
            class="btn-primary w-full flex justify-center py-3 px-4 shadow-md hover:shadow-lg focus:ring-2 focus:ring-offset-2 focus:ring-[#3d4494] transform active:scale-[0.98] font-bold"
          >
            @if (loading() || isPending()) {
              <ng-icon
                name="bootstrapArrowClockwise"
                class="animate-spin text-xl mr-2"
              ></ng-icon>
            }
            Crear Cuenta
          </button>
        </div>

        <div class="mt-6 text-center text-sm text-gray-600">
          ¿Ya tenés cuenta?
          <a
            routerLink="/auth/login"
            class="cursor-pointer font-bold text-[#3d4494] hover:text-[#2a2f63] hover:underline transition-colors ml-1"
          >
            Iniciar Sesión
          </a>
        </div>
      </form>
    </div>
  </div>
</main>
