<main class="flex min-h-screen items-center justify-center bg-gray-50 p-4">
  <div class="w-full max-w-2xl">
    <div class="mb-4 flex justify-start">
      <app-go-back-button></app-go-back-button>
    </div>

    <div class="rounded-xl bg-white p-8 shadow-xl border border-gray-100">
      <h1
        class="mb-2 text-center text-3xl font-bold uppercase tracking-widest text-[#3d4494]"
      >
        LaElsi
      </h1>

      <p class="mb-8 text-center text-gray-500 text-sm">
        Crea tu cuenta de cliente
      </p>

      @if (errorMessage()) {
        <div
          class="mb-6 rounded-md bg-red-100 p-3 text-center text-sm font-medium text-red-700 border border-red-200"
        >
          {{ errorMessage() }}
        </div>
      }

      <form
        [formGroup]="formRegister"
        (ngSubmit)="onSubmit()"
        class="space-y-5"
      >
        <div class="form-grid-2 gap-y-1">
          <!-- Nombre -->
          <div>
            <label for="name" class="form-label">Nombre <span class="text-red-500">*</span></label>
            <input
              type="text"
              id="name"
              name="name"
              formControlName="name"
              minlength="2"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Juan"
            />
            <app-field-error [control]="formRegister.controls.name" />
          </div>

          <!-- Apellido -->
          <div>
            <label for="lastName" class="form-label">Apellido <span class="text-red-500">*</span></label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              formControlName="lastName"
              minlength="2"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Perez"
            />
            <app-field-error [control]="formRegister.controls.lastName" />
          </div>

          <!-- DNI -->
          <div>
            <label for="dni" class="form-label">DNI <span class="text-red-500">*</span></label>
            <input
              type="text"
              id="dni"
              name="dni"
              formControlName="dni"
              inputmode="numeric"
              minlength="7"
              maxlength="8"
              class="form-input"
              placeholder="Ej: 12345678"
            />
            <app-field-error
              [control]="formRegister.controls.dni"
              validLabel="DNI disponible"
            />
          </div>

          <!-- Teléfono -->
          <div>
            <label for="phone" class="form-label">Teléfono <span class="text-red-500">*</span></label>
            <input
              type="text"
              id="phone"
              name="phone"
              formControlName="phone"
              inputmode="tel"
              minlength="8"
              maxlength="15"
              class="form-input"
              placeholder="Ej: 3415555555"
            />
            <app-field-error [control]="formRegister.controls.phone" />
          </div>

          <!-- Usuario -->
          <div>
            <label for="username" class="form-label">
              Nombre de Usuario <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="username"
              name="username"
              formControlName="username"
              minlength="4"
              maxlength="30"
              class="form-input"
              placeholder="Ej: jperez"
            />
            <app-field-error
              [control]="formRegister.controls.username"
              validLabel="Usuario disponible"
            />
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="form-label">Email <span class="text-red-500">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              formControlName="email"
              inputmode="email"
              maxlength="255"
              class="form-input"
              placeholder="Ej: juan@ejemplo.com"
            />
            <app-field-error
              [control]="formRegister.controls.email"
              validLabel="Email disponible"
            />
          </div>

          <!-- Contraseña -->
          <div class="md:col-span-2">
            <label for="password" class="form-label">
              Contraseña <span class="text-red-500">*</span>
            </label>
            <input
              type="password"
              id="password"
              name="password"
              formControlName="password"
              maxlength="100"
              class="form-input"
              placeholder="Mínimo 6 caracteres"
            />
            <app-field-error [control]="formRegister.controls.password" />
          </div>
        </div>

        <div class="pt-2">
          <button
            type="submit"
            [disabled]="loading() || formPending"
            class="btn-primary w-full flex justify-center py-3 shadow-md hover:shadow-lg transform active:scale-[0.98]"
          >
            @if (loading() || formPending) {
              <ng-icon
                name="bootstrapArrowClockwise"
                class="animate-spin text-xl mr-2"
              ></ng-icon>
            }
            Registrarme
          </button>
        </div>

        <div class="mt-6 text-center text-sm text-gray-600">
          ¿Ya tenés cuenta?
          <a
            routerLink="/auth/login"
            class="cursor-pointer font-bold text-[#3d4494] hover:text-[#2a2f63] hover:underline transition-colors ml-1"
          >
            Iniciar Sesión
          </a>
        </div>
      </form>
    </div>
  </div>
</main>
