<div
  class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-100 flex items-center justify-center p-4 animate-fadeIn duration-200"
>
  <div
    class="bg-white rounded-3xl shadow-xl w-full max-w-170 relative animate-in zoom-in-95 duration-200"
    clickOutside
    (clickOutside)="close.emit()"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <!-- Header -->
    <header
      class="flex items-center justify-between p-5 border-b border-gray-100"
    >
      <div class="flex items-center gap-3">
        <ng-icon
          name="bootstrapInfoCircle"
          class="text-2xl text-[#3d4494]"
        ></ng-icon>
        <h2 id="modal-title" class="text-xl font-bold text-gray-900">
          Recuperación de Contraseña
        </h2>
      </div>
      <app-close-modal-button (clicked)="close.emit()" />
    </header>

    <!-- Body -->
    <div class="p-6 text-left text-base text-gray-600 leading-relaxed">
      <p class="mb-4">
        Por el momento, esta funcionalidad requiere asistencia de un
        administrador.
      </p>
      <p class="mb-6">
        Por favor, contactanos por WhatsApp indicando tu
        <b class="text-gray-900">nombre de usuario</b> o
        <b class="text-gray-900">email</b>.
      </p>

      <div class="flex justify-center text-center">
        <a
          [href]="whatsappLink"
          target="_blank"
          rel="noopener noreferrer"
          class="px-5 py-2.5 rounded-xl bg-[#0F8477] text-white font-bold hover:bg-[#075E54] hover:shadow-md transition-all shadow-sm cursor-pointer flex items-center justify-center gap-2"
          (click)="close.emit()"
        >
          <ng-icon name="bootstrapWhatsapp" class="text-xl"></ng-icon>
          <span
            class="flex flex-col sm:flex-row items-center sm:gap-1.5 leading-tight"
          >
            <span>Enviar mensaje</span>
            <span class="text-sm font-medium">(+54 9 341 712-1860)</span>
          </span>
        </a>
      </div>
    </div>
  </div>
</div>
