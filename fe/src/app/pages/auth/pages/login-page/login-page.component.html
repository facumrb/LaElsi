<main
  class="flex min-h-dvh items-start py-8 lg:py-4 lg:items-center justify-center bg-gray-50 p-4 overflow-y-auto"
>
  <div
    class="w-full max-w-lg sm:max-w-xl md:max-w-2xl lg:max-w-5xl transition-all duration-300"
  >
    <div class="mb-3 flex justify-start">
      <app-go-back-button></app-go-back-button>
    </div>

    <div
      class="rounded-2xl bg-white p-8 lg:py-11 lg:px-12 shadow-sm border border-neutral-200 lg:grid lg:grid-cols-2 lg:gap-12 lg:items-stretch"
    >
      <!-- Columna Izquierda: Logo de Laelsi -->
      <div
        class="flex flex-col justify-center items-center text-center mb-4 lg:mb-0 lg:pr-6 lg:border-r lg:border-gray-100 relative"
      >
        <div
          class="absolute inset-0 bg-linear-to-br from-[#3d4494]/3 to-transparent rounded-l-xl -z-10"
        ></div>
        <h1 class="flex flex-col items-center">
          <app-logo
            [width]="128"
            [height]="48"
            loading="eager"
            customClass="h-14 lg:h-24 w-auto object-contain"
          />
          <span class="sr-only">LaElsi</span>
        </h1>
      </div>

      <!-- Columna Derecha: Formulario de Login -->
      <div class="w-full flex flex-col justify-center">
        <form
          [formGroup]="formLogin"
          novalidate
          (ngSubmit)="onSubmit()"
          class="space-y-5"
        >
          <div>
            <label for="username" class="mb-1.5 form-label font-semibold">
              Usuario o email
            </label>
            <input
              type="text"
              id="username"
              name="username"
              formControlName="username"
              minlength="4"
              maxlength="255"
              autocomplete="username"
              class="form-input p-3 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all"
            />
            <app-field-error [control]="formLogin.controls.username" />
          </div>

          <div>
            <label for="password" class="mb-1.5 form-label font-semibold">
              Contraseña
            </label>

            <div class="relative">
              <input
                [type]="passwordVisible() ? 'text' : 'password'"
                id="password"
                name="password"
                formControlName="password"
                maxlength="100"
                autocomplete="current-password"
                class="form-input p-3 pr-10 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all"
              />

              <app-password-toggle-button
                [(visible)]="passwordVisible"
                [show]="showEyeIcon()"
              />
            </div>

            <div class="mt-1 flex justify-between items-start">
              <div class="flex-1">
                <app-field-error [control]="formLogin.controls.password" />
              </div>

            <a
              routerLink="/auth/recover-password"
              class="cursor-pointer mt-1 text-sm font-medium text-[#3d4494] hover:underline"
            >
              ¿Olvidaste tu contraseña?
            </a>
          </div>
        </div>

          <div class="pt-2">
            <button
              type="submit"
              [disabled]="loading()"
              class="btn-primary w-full flex justify-center py-3 px-4 shadow-md hover:shadow-lg focus:ring-2 focus:ring-offset-2 focus:ring-[#3d4494] transform active:scale-[0.98] font-bold"
            >
              @if (loading()) {
                <ng-icon
                  name="bootstrapArrowClockwise"
                  class="animate-spin text-xl mr-2"
                ></ng-icon>
              }
              Iniciar Sesión
            </button>
          </div>


        <!-- Inicio de sesión con Google (Supabase Auth) -->
        <div class="flex items-center gap-3">
          <div class="grow border-t border-gray-200"></div>
          <span class="text-xs font-medium uppercase text-gray-400">o</span>
          <div class="grow border-t border-gray-200"></div>
        </div>

        <button
          type="button"
          (click)="loginWithGoogle()"
          [disabled]="loading()"
          class="cursor-pointer w-full flex items-center justify-center gap-2 py-3 px-4 rounded-lg border border-gray-300 bg-white font-semibold text-gray-700 shadow-sm hover:bg-gray-50 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#3d4494]"
        >
          <ng-icon name="bootstrapGoogle" class="text-lg"></ng-icon>
          Continuar con Google
        </button>

        <p class="text-center text-xs text-gray-500">
          Al continuar con Google, aceptás los
          <a
            routerLink="/terminos"
            target="_blank"
            class="font-semibold text-[#3d4494] hover:underline"
            >Términos y Condiciones</a
          >
          y la
          <a
            routerLink="/privacidad"
            target="_blank"
            class="font-semibold text-[#3d4494] hover:underline"
            >Política de Privacidad</a
          >.
        </p>

        <div class="mt-6 text-center text-sm text-gray-600">
          ¿No tenés cuenta aún?
          <a
            routerLink="/auth/register"
            replaceUrl="true"
            class="cursor-pointer font-bold text-[#3d4494] hover:text-[#2a2f63] hover:underline transition-colors ml-1"
          >
            Crear cuenta
          </a>
        </div>
        </form>
      </div>
    </div>
  </div>
</main>
