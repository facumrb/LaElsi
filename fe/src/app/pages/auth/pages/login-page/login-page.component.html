<main
  class="flex min-h-screen items-start pt-12 md:pt-4 md:items-center justify-center bg-gray-50 px-4 pb-4"
>
  <div class="w-full max-w-lg">
    <div class="mb-4 flex justify-start">
      <app-go-back-button></app-go-back-button>
    </div>

    <div class="rounded-xl bg-white p-8 shadow-xl border border-gray-100">
      <h1 class="mb-4 flex justify-center">
        <app-logo
          [width]="128"
          [height]="48"
          loading="eager"
          customClass="h-14 w-auto object-contain"
        />
      </h1>

      <p class="mb-6 text-center text-gray-500 text-sm">
        Ingresa tus credenciales para acceder
      </p>

      <form
        [formGroup]="formLogin"
        novalidate
        (ngSubmit)="onSubmit()"
        class="space-y-5"
      >
        <div>
          <label for="username" class="mb-1.5 form-label font-semibold">
            Nombre de usuario
          </label>
          <input
            type="text"
            id="username"
            name="username"
            formControlName="username"
            minlength="4"
            maxlength="30"
            autocomplete="username"
            class="form-input p-3 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all"
          />
          <app-field-error [control]="formLogin.controls.username" />
        </div>

        <div>
          <label for="password" class="mb-1.5 form-label font-semibold">
            Contraseña
          </label>

          <div class="relative">
            <input
              [type]="passwordVisible() ? 'text' : 'password'"
              id="password"
              name="password"
              formControlName="password"
              maxlength="100"
              autocomplete="current-password"
              class="form-input p-3 pr-10 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all"
            />

            <app-password-toggle-button
              [(visible)]="passwordVisible"
              [show]="showEyeIcon()"
            />
          </div>

          <div class="mt-1 flex justify-between items-start">
            <div class="flex-1">
              <app-field-error [control]="formLogin.controls.password" />
            </div>

            <button
              type="button"
              (click)="forgotPassword()"
              class="cursor-pointer mt-1 text-sm font-medium text-[#3d4494]"
            >
              ¿Olvidaste tu contraseña?
            </button>
          </div>
        </div>

        <div class="pt-2">
          <button
            type="submit"
            [disabled]="loading()"
            class="btn-primary w-full flex justify-center py-3 px-4 shadow-md hover:shadow-lg focus:ring-2 focus:ring-offset-2 focus:ring-[#3d4494] transform active:scale-[0.98] font-bold"
          >
            @if (loading()) {
              <ng-icon
                name="bootstrapArrowClockwise"
                class="animate-spin text-xl mr-2"
              ></ng-icon>
            }
            Iniciar Sesión
          </button>
        </div>

        <div class="mt-6 text-center text-sm text-gray-600">
          ¿No tenés cuenta aún?
          <a
            routerLink="/auth/register"
            class="cursor-pointer font-bold text-[#3d4494] hover:text-[#2a2f63] hover:underline transition-colors ml-1"
          >
            Crear cuenta
          </a>
        </div>
      </form>
    </div>
  </div>
</main>

@if (showRecoverPasswordModal()) {
  <app-recover-password-modal (close)="showRecoverPasswordModal.set(false)" />
}
