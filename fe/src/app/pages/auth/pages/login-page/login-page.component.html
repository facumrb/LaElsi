<main
  class="flex min-h-screen items-start py-8 lg:items-center justify-center bg-gray-50 p-4 overflow-y-auto"
>
  <div
    class="w-full max-w-lg sm:max-w-xl lg:max-w-4xl transition-all duration-300"
  >
    <div class="mb-4 flex justify-start">
      <app-go-back-button></app-go-back-button>
    </div>

    <div
      class="rounded-2xl bg-white p-8 lg:px-12 shadow-sm border border-neutral-200 lg:grid lg:grid-cols-2 lg:gap-12 lg:items-stretch"
    >
      <!-- Columna Izquierda: Logo de Laelsi -->
      <div
        class="flex flex-col justify-center items-center text-center mb-8 lg:mb-0 lg:pr-6 lg:border-r lg:border-gray-100 relative"
      >
        <div
          class="absolute inset-0 bg-linear-to-br from-[#3d4494]/3 to-transparent rounded-l-xl -z-10"
        ></div>
        <div class="flex flex-col items-center">
          <app-logo
            [width]="128"
            [height]="48"
            loading="eager"
            customClass="h-14 lg:h-24 w-auto object-contain"
          />
          <span class="sr-only">LaElsi</span>
        </div>
      </div>

      <!-- Columna Derecha: Formulario de Login -->
      <div class="w-full flex flex-col justify-center">
        <form
          [formGroup]="formLogin"
          novalidate
          (ngSubmit)="onSubmit()"
          class="space-y-5"
        >
          <div>
            <label for="username" class="mb-1.5 form-label font-semibold">
              Nombre de usuario
            </label>
            <input
              type="text"
              id="username"
              name="username"
              formControlName="username"
              minlength="4"
              maxlength="30"
              autocomplete="username"
              class="form-input p-3 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all"
            />
            <app-field-error [control]="formLogin.controls.username" />
          </div>

          <div>
            <label for="password" class="mb-1.5 form-label font-semibold">
              Contraseña
            </label>

            <div class="relative">
              <input
                [type]="passwordVisible() ? 'text' : 'password'"
                id="password"
                name="password"
                formControlName="password"
                maxlength="100"
                autocomplete="current-password"
                class="form-input p-3 pr-10 focus:border-[#3d4494] focus:ring-1 focus:ring-[#3d4494] outline-none transition-all"
              />

              <app-password-toggle-button
                [(visible)]="passwordVisible"
                [show]="showEyeIcon()"
              />
            </div>

            <div class="mt-1 flex justify-between items-start">
              <div class="flex-1">
                <app-field-error [control]="formLogin.controls.password" />
              </div>

              <button
                type="button"
                (click)="forgotPassword()"
                class="cursor-pointer mt-1 text-sm font-medium text-[#3d4494]"
              >
                ¿Olvidaste tu contraseña?
              </button>
            </div>
          </div>

          <div class="pt-2">
            <button
              type="submit"
              [disabled]="loading()"
              class="btn-primary w-full flex justify-center py-3 px-4 shadow-md hover:shadow-lg focus:ring-2 focus:ring-offset-2 focus:ring-[#3d4494] transform active:scale-[0.98] font-bold"
            >
              @if (loading()) {
                <ng-icon
                  name="bootstrapArrowClockwise"
                  class="animate-spin text-xl mr-2"
                ></ng-icon>
              }
              Iniciar Sesión
            </button>
          </div>

          <div class="mt-6 text-center text-sm text-gray-600">
            ¿No tenés cuenta aún?
            <a
              routerLink="/auth/register"
              replaceUrl="true"
              class="cursor-pointer font-bold text-[#3d4494] hover:text-[#2a2f63] hover:underline transition-colors ml-1"
            >
              Crear cuenta
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

@if (showRecoverPasswordModal()) {
  <app-recover-password-modal (close)="showRecoverPasswordModal.set(false)" />
}
