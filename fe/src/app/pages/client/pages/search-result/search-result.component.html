<div class="container mx-auto p-6 min-h-screen">
  <div class="mb-8">
    <h1 class="text-3xl font-black text-gray-900">
      Resultados para: <span class="text-[#3d4494]">"{{ searchTerm() }}"</span>
    </h1>
  </div>
  <!-- Componente de Filtros -->
  <app-products-filter
    [(priceOrder)]="priceOrder"
    [(brandFilter)]="brandFilter"
    [(popularityOrder)]="popularityOrder"
    [brands]="availableBrands()"
  />

  <!-- Grilla de Productos -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 mt-8">
    @for (product of productsFiltered(); track product.id) {
      <app-product-card [product]="product" />
    } @empty {
      <div class="col-span-full text-center py-12">
        <p class="text-gray-400 text-lg">
          No hay productos que coincidan con tus filtros.
        </p>
      </div>
    }
  </div>
</div>
