<div
  class="bg-white rounded-2xl shadow-sm border border-neutral-100 overflow-hidden"
>
  <div class="divide-y divide-neutral-100">
    @for (item of items(); track $index) {
      <div
        class="p-3 sm:p-4 flex items-center gap-3 sm:gap-6 hover:bg-neutral-50/50 transition-colors animate-in fade-in slide-in-from-bottom-2"
      >
        <div
          class="w-20 h-20 sm:w-24 sm:h-24 shrink-0 bg-neutral-50 rounded-xl overflow-hidden border border-neutral-200"
        >
          <app-product-image
            [imageUrl]="
              item.product.photos && item.product.photos.length > 0
                ? item.product.photos[0].fileName
                : null
            "
            [altText]="item.product.name"
            containerClass="w-full h-full bg-neutral-50"
          />
        </div>

        <div class="grow min-w-0">
          <div class="flex justify-between items-start mb-1 gap-2">
            <h2
              class="font-bold text-neutral-800 text-base sm:text-lg leading-snug line-clamp-2"
            >
              {{ item.product.name }}
            </h2>
            <button
              type="button"
              (click)="removeItem(item.product.id)"
              class="shrink-0 cursor-pointer text-neutral-400 hover:text-red-500 p-1 -mt-1 -mr-1 rounded-lg transition-all"
              title="Eliminar producto"
            >
              <ng-icon
                name="bootstrapTrash"
                class="text-lg sm:text-xl"
              ></ng-icon>
            </button>
          </div>

          <p
            class="text-neutral-500 text-xs sm:text-sm mb-2 sm:mb-4 font-medium truncate"
          >
            {{ item.product.brand }}
          </p>

          <div
            class="flex flex-wrap items-end justify-between gap-y-3 gap-x-2 mt-2 sm:mt-4"
          >
            <div
              class="flex items-center border border-neutral-200 rounded-lg h-8 sm:h-9 shrink-0"
            >
              <!-- Boton para restar una unidad -->
              <button
                type="button"
                (click)="updateQuantity(item.product.id, item.quantity - 1)"
                class="cursor-pointer w-8 sm:w-9 h-full flex items-center justify-center text-neutral-500 hover:text-[#3d4494] hover:bg-neutral-50 rounded-l-lg transition-colors disabled:opacity-50 disabled:hover:text-neutral-500 disabled:hover:bg-transparent disabled:cursor-not-allowed"
                [disabled]="item.quantity <= 1"
                [attr.aria-label]="'Disminuir cantidad de ' + item.product.name"
              >
                <ng-icon
                  name="bootstrapDash"
                  aria-hidden="true"
                  class="text-sm sm:text-base"
                ></ng-icon>
              </button>

              <span
                class="min-w-8 sm:min-w-10 text-center font-semibold text-neutral-800 text-xs sm:text-sm"
              >
                {{ item.quantity }}
              </span>

              <!-- Boton para añadir una unidad -->
              <button
                type="button"
                (click)="updateQuantity(item.product.id, item.quantity + 1)"
                class="cursor-pointer w-8 sm:w-9 h-full flex items-center justify-center text-neutral-500 hover:text-[#3d4494] hover:bg-neutral-50 rounded-r-lg transition-colors disabled:opacity-50 disabled:hover:text-neutral-500 disabled:hover:bg-transparent disabled:cursor-not-allowed"
                [attr.aria-label]="'Aumentar cantidad de ' + item.product.name"
                [disabled]="item.quantity >= item.product.stock"
              >
                <ng-icon
                  name="bootstrapPlus"
                  aria-hidden="true"
                  class="text-sm sm:text-base"
                ></ng-icon>
              </button>
            </div>

            <div class="text-right shrink-0">
              <p
                class="text-base sm:text-lg font-bold text-[#3d4494] leading-tight mb-0.5 sm:mb-1"
              >
                {{
                  getCurrentPrice(item.product) * item.quantity
                    | currency: "ARS" : "symbol-narrow" : "1.0-0"
                }}
              </p>

              <p class="text-[10px] sm:text-xs font-medium text-neutral-500">
                {{
                  getCurrentPrice(item.product)
                    | currency: "ARS" : "symbol-narrow" : "1.0-0"
                }}
                c/u
              </p>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>

<div class="flex justify-end">
  <button
    type="button"
    (click)="clearCart()"
    class="cursor-pointer text-sm text-gray-500 hover:text-red-600 font-medium flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-red-50 transition-all"
  >
    <ng-icon name="bootstrapCartX"></ng-icon>
    Vaciar todo el carrito
  </button>
</div>
