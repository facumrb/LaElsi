<div class="animate-fadeIn min-h-screen pb-12 pt-8">
  <div class="container mx-auto max-w-6xl px-4 md:px-6 relative z-20">
    <div class="flex flex-col lg:flex-row gap-8">
      <!-- Navegación Lateral (Sidebar / Navbar Móvil) -->
      <aside class="w-full lg:w-70 shrink-0">
        <div
          class="bg-white/90 backdrop-blur-xl rounded-2xl md:rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-white/60 p-3 md:p-6 relative z-30"
        >
          <div class="flex flex-col gap-2 md:gap-3">
            <a
              [routerLink]="['/profile']"
              [routerLinkActiveOptions]="{ exact: true }"
              routerLinkActive="bg-violet-600/10 text-violet-700 shadow-sm border-violet-600/20"
              class="w-full text-left px-5 py-4 rounded-xl md:rounded-2xl transition-all duration-200 font-bold flex items-center gap-4 border border-transparent text-gray-500 hover:bg-gray-50 hover:text-gray-800"
            >
              <ng-icon name="bootstrapFilePerson" class="text-2xl"></ng-icon>
              <span>Datos Personales</span>
            </a>

            <a
              [routerLink]="['/profile/account']"
              routerLinkActive="bg-violet-600/10 text-violet-700 shadow-sm border-violet-600/20"
              class="w-full text-left px-5 py-4 rounded-xl md:rounded-2xl transition-all duration-200 font-bold flex items-center gap-4 border border-transparent text-gray-500 hover:bg-gray-50 hover:text-gray-800"
            >
              <ng-icon name="bootstrapShieldLock" class="text-2xl"></ng-icon>
              <span>Datos de Usuario</span>
            </a>

            <a
              [routerLink]="['/profile/orders']"
              routerLinkActive="bg-violet-600/10 text-violet-700 shadow-sm border-violet-600/20"
              class="w-full text-left px-5 py-4 rounded-xl md:rounded-2xl transition-all duration-200 font-bold flex items-center gap-4 border border-transparent text-gray-500 hover:bg-gray-50 hover:text-gray-800"
            >
              <ng-icon name="bootstrapBoxSeam" class="text-2xl"></ng-icon>
              <span>Mis Pedidos</span>
            </a>
          </div>
        </div>
      </aside>

      <!-- Panel de Contenido Principal -->
      <div class="flex-1 w-full lg:w-auto mt-2 lg:mt-0 lg:pl-4 min-w-0">
        @if (loading()) {
          <div
            class="flex justify-center items-center py-20 bg-white/50 backdrop-blur-xl rounded-3xl border border-white/40 shadow-sm min-h-100"
          >
            <div
              class="animate-spin rounded-full h-12 w-12 border-b-4 border-[#3d4494]"
            ></div>
          </div>
        } @else {
          <!-- Rutas Hijas -->
          <router-outlet
            (activate)="onActivate($event)"
            (deactivate)="loading.set(false)"
          />
        }
      </div>
    </div>
  </div>
</div>
