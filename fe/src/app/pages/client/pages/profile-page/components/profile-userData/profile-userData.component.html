<div class="animate-in fade-in slide-in-from-bottom-4 duration-500">
  <form [formGroup]="formUsuario" (ngSubmit)="onSubmit()" class="space-y-6">
    <div
      class="bg-white/80 backdrop-blur-xl p-6 md:p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-white/50 relative group"
    >
      <div class="flex items-center gap-3 mb-8">
        <div
          class="w-12 h-12 rounded-2xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600"
        >
          <ng-icon name="bootstrapShieldLock" class="text-2xl"></ng-icon>
        </div>
        <div>
          <h1
            class="text-xl md:text-2xl font-bold text-gray-800 tracking-tight"
          >
            Datos de Autenticación
          </h1>
          <p class="text-xs md:text-sm font-medium text-gray-500">
            Gestiona tus credenciales de acceso
          </p>
        </div>
      </div>

      <!-- Foto de Perfil -->
      <div
        class="mb-10 p-6 bg-gray-50/50 rounded-2xl border border-gray-100 relative z-10 flex flex-col items-center justify-center text-center"
      >
        <h2
          class="text-sm font-bold text-gray-700 mb-4 tracking-wide uppercase"
        >
          Foto de Perfil
        </h2>
        <app-photo-manager
          [currentPhoto]="profile()?.photo || null"
          [userFullName]="
            (profile()?.name || '') + ' ' + (profile()?.lastName || '')
          "
        >
        </app-photo-manager>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 relative z-10">
        <div class="space-y-6">
          <div>
            <label
              for="username"
              class="block text-xs font-black text-gray-500 uppercase tracking-widest pl-1 mb-2 cursor-pointer"
              >Nombre de Usuario</label
            >
            <input
              type="text"
              id="username"
              name="username"
              formControlName="username"
              minlength="4"
              maxlength="30"
              placeholder="Ej: jperez"
              class="w-full p-3.5 bg-gray-50 border border-gray-200 text-gray-800 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all font-medium"
            />
            <app-field-error
              [control]="formUsuario.controls.username"
              validLabel="Usuario disponible"
            />
          </div>
        </div>

        <div
          class="space-y-6 bg-blue-50/30 p-6 rounded-2xl border border-blue-50"
        >
          <div>
            <label
              for="password"
              class="block text-xs font-black text-blue-700 uppercase tracking-widest pl-1 mb-2 cursor-pointer"
              >Nueva Contraseña</label
            >
            <input
              type="password"
              id="password"
              name="password"
              formControlName="password"
              maxlength="100"
              placeholder="Solo si deseas cambiarla..."
              class="w-full p-3.5 bg-white border border-blue-200 text-gray-800 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-medium placeholder-blue-300"
            />
            <app-field-error [control]="formUsuario.controls.password" />
            <p
              class="text-[10px] text-blue-500 font-medium pl-1 mt-1 leading-tight"
            >
              Mínimo 8 caracteres, al menos una mayúscula y un número apoyando
              caracteres especiales.
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="flex justify-end pt-2">
      <button
        type="submit"
        [disabled]="saving() || formUsuario.invalid"
        class="bg-[#3d4494] text-white px-10 py-4 rounded-xl font-bold shadow-xl shadow-[#3d4494]/30 hover:bg-[#2d336b] hover:-translate-y-1 transition-all duration-300 disabled:opacity-50 disabled:hover:translate-y-0 disabled:cursor-not-allowed flex items-center gap-3 active:scale-95 cursor-pointer"
      >
        @if (saving()) {
          <span
            class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"
          ></span>
          Actualizando...
        } @else {
          Actualizar Credenciales
        }
      </button>
    </div>
  </form>
</div>
