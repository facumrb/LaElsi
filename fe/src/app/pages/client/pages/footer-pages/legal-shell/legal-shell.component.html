<div class="flex min-h-dvh flex-col bg-gray-50">
  <header class="bg-[#3d4494] py-3 text-white">
    <div
      class="container mx-auto flex items-center justify-between gap-4 px-4"
    >
      <a routerLink="/" aria-label="Ir al inicio de Laelsi">
        <app-logo
          [width]="128"
          [height]="48"
          alt="Laelsi"
          loading="eager"
          customClass="h-10 w-auto object-contain"
        />
      </a>
      <a
        routerLink="/"
        class="text-sm font-semibold transition-colors hover:text-[#f4abac]"
      >
        &larr; Volver a la tienda
      </a>
    </div>
  </header>

  <main class="grow">
    <ng-content />
  </main>

  <footer class="bg-[#3d4494] py-4 text-xs text-gray-300">
    <div class="container mx-auto px-4">
      <nav
        aria-label="Enlaces legales"
        class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2"
      >
        <a routerLink="/privacidad" class="transition-colors hover:text-[#f4abac]"
          >Política de Privacidad</a
        >
        <a routerLink="/terminos" class="transition-colors hover:text-[#f4abac]"
          >Términos y Condiciones</a
        >
        <a
          routerLink="/arrepentimiento"
          class="transition-colors hover:text-[#f4abac]"
          >Botón de arrepentimiento</a
        >
      </nav>
      <p class="mt-3 text-center">{{ legal.brand }} · {{ legal.address }}</p>
    </div>
  </footer>
</div>
