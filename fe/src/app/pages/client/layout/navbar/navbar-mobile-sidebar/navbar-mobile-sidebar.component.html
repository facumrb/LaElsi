<!-- Backdrop -->
<div
  class="fixed inset-0 bg-black/60 backdrop-blur-sm z-60 transition-all duration-300 ease-in-out md:hidden"
  [class.opacity-0]="!isOpen()"
  [class.opacity-100]="isOpen()"
  [class.invisible]="!isOpen()"
  [class.visible]="isOpen()"
  (click)="close()"
  aria-hidden="true"
></div>

<!-- Sidebar -->
<div
  class="fixed inset-y-0 left-0 w-72 bg-white z-70 shadow-2xl flex flex-col transition-all duration-300 ease-in-out md:hidden"
  [class.-translate-x-full]="!isOpen()"
  [class.translate-x-0]="isOpen()"
  [class.invisible]="!isOpen()"
  [class.visible]="isOpen()"
  role="dialog"
  aria-modal="true"
  aria-label="Menú principal móvil"
  [attr.inert]="!isOpen() ? '' : null"
  [cdkTrapFocus]="isOpen()"
  [cdkTrapFocusAutoCapture]="isOpen()"
>
  <!-- Header con logo -->
  <div class="flex items-center justify-center p-4 bg-[#3d4494] shadow-sm">
    <app-logo
      [width]="128"
      [height]="48"
      customClass="h-12 w-auto object-contain"
    />
  </div>

  <!-- Contenido scrolleable: categorías en acordeón + links estáticos -->
  <div class="flex-1 overflow-y-auto pb-2">
    <nav class="flex flex-col" aria-label="Menú móvil de categorías">
      @for (cat of categories(); track cat.id) {
        <app-navbar-accordion-item
          [category]="cat"
          [depth]="0"
          [activeCategoryIds]="activeCategoryIds()"
          (navigated)="close()"
        />
      }

      <!-- Categorías estáticas (misma estética que categorías nivel 1) -->
      <div
        class="flex items-center hover:bg-gray-100 transition-colors w-full cursor-pointer border-b border-gray-100/80"
        routerLinkActive=""
        #impLink="routerLinkActive"
      >
        <a
          routerLink="/impresiones"
          (click)="close()"
          class="flex-1 py-3 pl-6 font-bold block"
          [style.color]="impLink?.isActive ? '#5a2a8a' : null"
          [class.text-gray-700]="!impLink?.isActive"
        >
          Impresiones
        </a>
      </div>
      <div
        class="flex items-center hover:bg-gray-100 transition-colors w-full cursor-pointer border-b border-gray-100/80"
        routerLinkActive=""
        #disLink="routerLinkActive"
      >
        <a
          routerLink="/disenio"
          (click)="close()"
          class="flex-1 py-3 pl-6 font-bold block"
          [style.color]="disLink?.isActive ? '#5a2a8a' : null"
          [class.text-gray-700]="!disLink?.isActive"
        >
          Diseño Gráfico
        </a>
      </div>
      <div
        class="flex items-center hover:bg-gray-100 transition-colors w-full cursor-pointer border-b border-gray-100/80"
        routerLinkActive=""
        #selLink="routerLinkActive"
      >
        <a
          routerLink="/sellos"
          (click)="close()"
          class="flex-1 py-3 pl-6 font-bold block"
          [style.color]="selLink?.isActive ? '#5a2a8a' : null"
          [class.text-gray-700]="!selLink?.isActive"
        >
          Sellos
        </a>
      </div>
    </nav>
  </div>

  <!-- Footer: auth section -->
  <div class="border-t border-gray-100 p-4 bg-gray-50">
    @if (isLoggedIn()) {
      @if (isAdmin()) {
        <a
          routerLink="/admin/dashboard"
          (click)="close()"
          class="flex items-center gap-3 px-4 py-3 text-[#5a2a8a] font-bold hover:bg-white rounded-lg mb-1"
        >
          <ng-icon name="bootstrapSpeedometer2" class="text-xl"></ng-icon>
          Admin
        </a>
        <a
          routerLink="/admin/view-profile"
          (click)="close()"
          class="flex items-center gap-3 px-4 py-3 text-gray-700 font-bold hover:bg-white rounded-lg mb-1"
        >
          <ng-icon name="bootstrapPerson" class="text-xl"></ng-icon> Mi Perfil
        </a>
      } @else {
        <a
          routerLink="/profile"
          (click)="close()"
          class="flex items-center gap-3 px-4 py-3 text-gray-700 font-bold hover:bg-white rounded-lg mb-1"
        >
          <ng-icon name="bootstrapPerson" class="text-xl"></ng-icon> Mi Perfil
        </a>
      }
      <button
        (click)="handleLogout()"
        class="cursor-pointer w-full text-left flex items-center gap-3 px-4 py-3 text-red-600 font-bold hover:bg-white rounded-lg"
      >
        <ng-icon name="bootstrapBoxArrowRight" class="text-xl"></ng-icon>
        Cerrar Sesión
      </button>
    } @else {
      <a
        routerLink="/auth/login"
        (click)="close()"
        class="block w-full text-center bg-[#3d4494] text-white py-3 rounded-lg font-bold shadow-md hover:bg-[#2d336b] transition"
      >
        Iniciar Sesión
      </a>
    }
  </div>
</div>
