<div class="relative w-full z-50" (clickOutside)="showResults.set(false)">
  <div
    class="flex items-center w-full bg-white border border-gray-300 rounded-xl overflow-hidden transition-all duration-200 focus-within:ring-2 focus-within:ring-[#049A8F] focus-within:border-[#049A8F] shadow-sm hover:shadow-md"
    role="search"
  >
    <label for="search-input" class="sr-only">Buscar productos</label>

    <input
      id="search-input"
      type="text"
      [ngModel]="query()"
      (ngModelChange)="onSearch($event)"
      (keyup.enter)="handleFullSearch()"
      inputmode="search"
      placeholder="Buscar productos ..."
      autocomplete="off"
      class="flex-1 h-11 bg-transparent px-4 text-gray-800 placeholder:text-gray-400 focus:outline-none border-none text-sm min-w-0"
    />

    <div class="flex items-center pr-1 gap-1 shrink-0">
      @if (isLoading()) {
        <div
          class="animate-spin h-4 w-4 border-2 border-gray-300 border-t-[#049A8F] rounded-full mr-2"
        ></div>
      }

      <button
        (click)="handleFullSearch()"
        type="button"
        aria-label="Realizar búsqueda"
        class="h-9 w-9 bg-[#037971] rounded-lg text-white flex items-center justify-center cursor-pointer hover:bg-[#049A8F] transition-all active:scale-95 shadow-sm mx-1"
      >
        <ng-icon name="bootstrapSearch" class="text-sm"></ng-icon>
      </button>
    </div>
  </div>

  @if (showResults() && results().length > 0) {
    <div
      class="absolute top-[calc(100%+0.5rem)] left-0 w-full bg-white shadow-2xl rounded-xl overflow-hidden border border-gray-100 animate-in fade-in slide-in-from-top-2 duration-150"
    >
      <div class="p-2">
        @for (product of results(); track product.id) {
          <div
            (click)="goToProduct(product.id)"
            class="flex items-center gap-3 p-2.5 hover:bg-gray-50 cursor-pointer rounded-lg transition-colors group focus-within:bg-gray-50"
            role="button"
            tabindex="0"
            (keyup.enter)="goToProduct(product.id)"
          >
            <div
              class="w-10 h-10 shrink-0 rounded-md overflow-hidden border border-gray-200 bg-gray-100"
            >
              <app-product-image
                [imageUrl]="
                  product.photos && product.photos.length > 0
                    ? product.photos[0].fileName
                    : null
                "
                [altText]="product.name"
                containerClass="w-full h-full bg-transparent"
              />
            </div>
            <div class="flex flex-col overflow-hidden">
              <span
                class="text-sm font-bold text-gray-700 group-hover:text-[#3d4494] truncate"
                >{{ product.name }}</span
              ><span
                class="text-[10px] uppercase tracking-wide text-gray-400 truncate font-semibold"
                >{{ product.brand }}</span
              >
            </div>
            <span
              class="ml-auto text-sm font-bold text-[#037971] whitespace-nowrap bg-[#037971]/10 px-2 py-0.5 rounded-md"
              >{{
                getProductPrice(product)
                  | currency: getProductCurrency(product) : "symbol" : "1.0-0"
              }}</span
            >
          </div>
        }
        <button
          (click)="handleFullSearch()"
          type="button"
          class="cursor-pointer w-full py-2.5 mt-2 text-center text-xs font-bold text-white bg-[#3d4494] hover:bg-[#2a2f63] transition-all rounded-lg shadow-sm tracking-wide"
        >
          VER TODOS LOS RESULTADOS
        </button>
      </div>
    </div>
  }
</div>
