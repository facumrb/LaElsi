<nav
  class="grid grid-cols-[auto_1fr_auto] lg:grid-cols-3 items-center bg-[#3d4494] px-4 md:px-6 py-3 relative z-20"
  aria-label="Navegación principal"
>
  <div class="flex items-center gap-4 justify-self-start">
    <button
      type="button"
      class="md:hidden h-10 w-10 flex items-center justify-center text-white cursor-pointer rounded-md hover:bg-white/10 transition-colors"
      (click)="menuToggled.emit()"
      aria-label="Abrir menú de navegación"
    >
      <ng-icon name="bootstrapList" class="text-3xl"></ng-icon>
    </button>

    <a routerLink="/" class="shrink-0 block" aria-label="Ir al inicio">
      <app-logo
        [width]="128"
        [height]="48"
        loading="eager"
        customClass="w-24 md:w-32 h-auto object-contain"
      />
    </a>
  </div>

  <div class="hidden lg:flex w-full max-w-xl justify-self-center">
    <app-search-bar class="w-full" />
  </div>

  <div class="flex items-center gap-3 md:gap-4 justify-self-end">
    @if (isAdmin()) {
      <a
        routerLink="/admin/dashboard"
        class="hidden sm:flex items-center gap-3 pl-1 pr-4 py-1 rounded-full border border-white/20 bg-white/5 hover:bg-white/10 transition-all focus:outline-none focus:ring-2 focus:ring-white/50"
        title="Ir al Panel de Administrador"
      >
        <div
          class="h-8 w-8 rounded-full bg-white/10 flex items-center justify-center border border-white/10"
        >
          <ng-icon
            name="bootstrapSpeedometer2"
            class="text-lg text-white"
          ></ng-icon>
        </div>
        <span class="text-sm font-bold text-white">Admin</span>
      </a>
    }

    @if (isLoggedIn()) {
      <div class="relative" (clickOutside)="showUserMenu.set(false)">
        <button
          type="button"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="showUserMenu()"
          class="cursor-pointer flex items-center gap-3 pl-1 pr-4 py-1 rounded-full border border-white/20 bg-white/5 hover:bg-white/10 transition-all focus:outline-none focus:ring-2 focus:ring-white/50"
        >
          <app-user-avatar
            size="xs"
            [photo]="currentUser()?.photo"
            [name]="currentUser()?.name || ''"
            [lastName]="currentUser()?.lastName || ''"
          />
          <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-white max-w-25 truncate">
              {{ currentUser()?.name }}
            </span>
            <ng-icon
              name="bootstrapChevronDown"
              class="text-xs text-white/70 transition-transform duration-200"
              [class.rotate-180]="showUserMenu()"
            ></ng-icon>
          </div>
        </button>

        @if (showUserMenu()) {
          <div
            class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-2xl ring-1 ring-black border border-black/5 z-50 animate-in fade-in slide-in-from-top-1 origin-top-right overflow-hidden"
          >
            @if (isAdmin()) {
              <a
                routerLink="/admin/view-profile"
                (click)="showUserMenu.set(false)"
                class="flex items-center gap-3 px-4 pt-3 pb-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
              >
                <ng-icon name="bootstrapPerson" class="text-xl"></ng-icon> Mi
                Perfil
              </a>
            } @else {
              <a
                routerLink="/profile"
                (click)="showUserMenu.set(false)"
                class="flex items-center gap-3 px-4 pt-3 pb-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
              >
                <ng-icon name="bootstrapPerson" class="text-lg"></ng-icon> Mi
                Perfil
              </a>
            }

            <div class="border-t border-gray-100 hidden md:block"></div>
            <button
              (click)="handleLogout()"
              class="cursor-pointer w-full text-left flex items-center gap-3 px-4 pt-2 pb-3 text-sm text-red-600 hover:bg-gray-100 transition-colors"
            >
              <ng-icon name="bootstrapBoxArrowRight" class="text-lg"></ng-icon>
              Cerrar Sesión
            </button>
          </div>
        }
      </div>
    } @else {
      <a
        routerLink="/auth/login"
        class="cursor-pointer flex items-center gap-2 rounded-full border border-white/20 bg-white/5 px-4 py-2 text-sm font-bold text-white hover:bg-white/10 transition-all focus:ring-2 focus:ring-white/50"
      >
        <ng-icon name="bootstrapPersonCircle" class="text-xl"></ng-icon>
        <span>Ingresar</span>
      </a>
    }

    <a
      routerLink="/cart"
      class="relative flex items-center justify-center h-10 w-10 rounded-full bg-[#037971] text-white hover:bg-[#049A8F] hover:scale-105 transition-all shadow-sm border border-white/10"
      aria-label="Ver carrito de compras"
    >
      <ng-icon name="bootstrapCart3" class="text-xl"></ng-icon>
      @if (cartCount() > 0) {
        <span
          class="absolute -top-1 -right-1 flex h-5 w-5 items-center justify-center rounded-full bg-[#f4abac] text-[10px] font-bold text-[#3d4494] shadow-sm border-2 border-[#3d4494]"
        >
          {{ cartCount() }}
        </span>
      }
    </a>
  </div>
</nav>

<div class="lg:hidden bg-[#3d4494] px-4 pb-4 shadow-md relative z-10">
  <app-search-bar />
</div>
