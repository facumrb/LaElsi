<footer class="w-full bg-[#3d4494] py-3 text-white">
  <div class="container mx-auto px-4">
    <div class="grid grid-cols-1 gap-y-6 gap-x-4 md:grid-cols-3">
      <div>
        <h2 class="mb-2 text-xl font-bold text-[#f4abac]">
          Horarios de atención
        </h2>
        <div class="flex flex-col gap-1 text-sm">
          <div class="flex items-center gap-2">
            <ng-icon name="bootstrapClock" class="text-[#f4abac]"></ng-icon>
            <p>{{ horario1Signal() }}</p>
          </div>
          <div class="flex items-center gap-2">
            <ng-icon name="bootstrapClock" class="text-[#f4abac]"></ng-icon>
            <p>{{ horario2Signal() }}</p>
          </div>
        </div>
      </div>

      <div class="flex flex-col md:items-center">
        <div class="w-fit">
          <h2 class="mb-2 text-xl font-bold text-[#f4abac]">
            Enlaces de Interés
          </h2>
          <nav class="text-sm">
            <ul class="space-y-1">
              <li>
                <a
                  routerLink="/about-us"
                  class="relative inline-block w-fit cursor-pointer transition-colors hover:text-[#f4abac] after:absolute after:bottom-0 after:left-0 after:h-px after:w-0 after:bg-[#f4abac] after:transition-all after:duration-400 hover:after:w-full"
                >
                  ¿Quiénes somos?
                </a>
              </li>
              <li>
                <a
                  routerLink="/faq"
                  class="relative inline-block w-fit cursor-pointer transition-colors hover:text-[#f4abac] after:absolute after:bottom-0 after:left-0 after:h-px after:w-0 after:bg-[#f4abac] after:transition-all after:duration-400 hover:after:w-full"
                >
                  Preguntas Frecuentes (FAQ)
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>

      <div class="flex flex-col md:items-end">
        <div class="flex flex-col gap-2">
          <h2 class="text-xl font-bold text-[#f4abac]">Contacto</h2>

          <div class="flex flex-wrap items-center gap-4">
            <a
              href="https://www.instagram.com/laelsi.ros/"
              target="_blank"
              aria-label="Seguinos en Instagram"
              class="flex items-center hover:text-[#f4abac] hover:scale-110 transition-transform"
            >
              <ng-icon name="bootstrapInstagram" class="text-xl"></ng-icon>
            </a>

            <a
              href="https://wa.me/5493417121860"
              target="_blank"
              aria-label="Contactanos por WhatsApp"
              class="flex items-center gap-2 hover:text-[#f4abac] hover:scale-105 transition-all group"
            >
              <ng-icon name="bootstrapWhatsapp" class="text-xl"></ng-icon>
              <span class="text-sm font-medium">+54 9 341 712-1860</span>
            </a>
          </div>

          <a
            href="https://maps.app.goo.gl/EBJc2ugXp5WqtTbJA"
            target="_blank"
            class="relative inline-flex items-start gap-2 text-sm leading-tight transition-colors hover:text-[#f4abac] w-fit after:absolute after:bottom-0 after:left-0 after:h-px after:w-0 after:bg-[#f4abac] after:transition-all after:duration-400 hover:after:w-full"
          >
            <ng-icon
              name="bootstrapGeoAlt"
              class="mt-0.5 text-[#f4abac]"
              aria-hidden="true"
            ></ng-icon>
            <span>9 de Julio 2325, Rosario (2000), Santa Fe, Argentina</span>
          </a>
        </div>
      </div>
    </div>

    <div
      class="mt-3 border-t border-white/10 pt-3 text-center text-xs text-gray-300"
    >
      <div class="flex items-center justify-center gap-2">
        <p>Copyright &copy; {{ currentYear() }}</p>
        <app-logo
          [width]="128"
          [height]="48"
          customClass="h-5 w-auto object-contain"
        />
        <p>&boxh; Todos los derechos reservados.</p>
      </div>
    </div>
  </div>
</footer>
