<header>
  <nav
    class="flex items-center justify-between bg-[#3d4494] px-5 py-3 text-black"
  >
    <a routerLink="/">
      <img src="assets/Logo.png" alt="La Elsi logo" class="w-30" />
    </a>

    <div class="flex items-center justify-center gap-3">
      <input
        type="text"
        class="h-10 w-100 rounded-md bg-white px-3 text-black placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-[#049A8F]"
        placeholder="Buscar articulo..."
      />
      <button
        class="cursor-pointer flex h-10 w-12 items-center justify-center rounded-md bg-[#037971] text-white transition-colors hover:bg-[#049A8F]"
        type="submit"
      >
        <ng-icon name="bootstrapSearch" class="text-xl font-bold"></ng-icon>
      </button>
    </div>

    <div class="ml-6 flex items-center gap-3">
      <a routerLink="/auth/login">
        <button
          class="cursor-pointer flex items-center gap-2 rounded-md bg-[#037971] px-4 py-2 font-medium text-white transition-colors hover:bg-[#049A8F]"
        >
          <ng-icon name="bootstrapPersonCircle" class="text-2xl"></ng-icon>
          {{ userSignal() }}
        </button>
      </a>

      <a routerLink="/carrito">
        <button
          class="cursor-pointer flex items-center gap-2 rounded-md bg-[#037971] px-4 py-2 font-medium text-white transition-colors hover:bg-[#049A8F]"
        >
          <ng-icon name="bootstrapCart3" class="text-2xl"></ng-icon>
          {{ carritoSignal() }}
        </button>
      </a>
    </div>
  </nav>

  <nav class="flex justify-around bg-[#9574a4] p-2.5 text-[#f4abac]">
    @for (cat of categories; track cat.id) {
      <a
        [routerLink]="['/category', cat.id]"
        routerLinkActive="text-[#f4abac] underline decoration-2 underline-offset-4"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-white no-underline transition-colors hover:text-[#f4abac]"
      >
        {{ cat.name }}
      </a>
    }
    <a
      routerLink="/impresiones"
      routerLinkActive="text-[#f4abac] underline decoration-2 underline-offset-4"
      [routerLinkActiveOptions]="{ exact: true }"
      class="text-white no-underline transition-colors hover:text-[#f4abac]"
    >
      Impresiones
    </a>

    <a
      routerLink="/disenio"
      routerLinkActive="text-[#f4abac] underline decoration-2 underline-offset-4"
      [routerLinkActiveOptions]="{ exact: true }"
      class="text-white no-underline transition-colors hover:text-[#f4abac]"
    >
      Diseño Gráfico
    </a>

    <a
      routerLink="/sellos"
      routerLinkActive="text-[#f4abac] underline decoration-2 underline-offset-4"
      [routerLinkActiveOptions]="{ exact: true }"
      class="text-white no-underline transition-colors hover:text-[#f4abac]"
    >
      Sellos
    </a>
  </nav>
</header>
