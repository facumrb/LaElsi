@if (variant() === "solid") {
  @if (showControls()) {
    <div class="flex gap-2">
      <button
        [disabled]="disablePrev()"
        (click)="prev.emit()"
        aria-label="Anterior"
        class="h-10 w-10 rounded-full bg-white border border-gray-200 shadow-sm hover:shadow hover:bg-gray-50 flex items-center justify-center transition-all cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:shadow-sm"
      >
        <ng-icon
          name="bootstrapChevronLeft"
          class="text-xl text-gray-600"
        ></ng-icon>
      </button>
      <button
        [disabled]="disableNext()"
        (click)="next.emit()"
        aria-label="Siguiente"
        class="h-10 w-10 rounded-full bg-white border border-gray-200 shadow-sm hover:shadow hover:bg-gray-50 flex items-center justify-center transition-all cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:shadow-sm"
      >
        <ng-icon
          name="bootstrapChevronRight"
          class="text-xl text-gray-600"
        ></ng-icon>
      </button>
    </div>
  }
}

@if (variant() === "glass" && showControls()) {
  <button
    [disabled]="disablePrev()"
    (click)="prev.emit()"
    class="elsi-glass-nav absolute left-4 top-1/2 -translate-y-1/2 z-10 flex items-center justify-center w-12 h-12 disabled:opacity-0"
    aria-label="Anterior"
  >
    <ng-icon name="bootstrapChevronLeft" class="text-2xl"></ng-icon>
  </button>

  <button
    [disabled]="disableNext()"
    (click)="next.emit()"
    class="elsi-glass-nav absolute right-4 top-1/2 -translate-y-1/2 z-10 flex items-center justify-center w-12 h-12 disabled:opacity-0"
    aria-label="Siguiente"
  >
    <ng-icon name="bootstrapChevronRight" class="text-2xl"></ng-icon>
  </button>
}

@if (variant() === "ghost-wrapper") {
  <div class="flex md:flex-col items-center gap-2">
    @if (showControls()) {
      <button
        [disabled]="disablePrev()"
        (click)="prev.emit()"
        class="disabled:opacity-20 disabled:cursor-not-allowed text-gray-400 hover:text-[#f4abac] disabled:hover:text-gray-400 transition-colors p-1 cursor-pointer"
        aria-label="Anterior"
      >
        <ng-icon
          name="bootstrapChevronUp"
          class="text-xl md:text-2xl -rotate-90 md:rotate-0"
        ></ng-icon>
      </button>
    }

    <ng-content></ng-content>

    @if (showControls()) {
      <button
        [disabled]="disableNext()"
        (click)="next.emit()"
        class="disabled:opacity-20 disabled:cursor-not-allowed text-gray-500 hover:text-[#f4abac] disabled:hover:text-gray-500 transition-colors p-1 cursor-pointer"
        aria-label="Siguiente"
      >
        <ng-icon
          name="bootstrapChevronDown"
          class="text-xl md:text-2xl -rotate-90 md:rotate-0"
        ></ng-icon>
      </button>
    }
  </div>
}
