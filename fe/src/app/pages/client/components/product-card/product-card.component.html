<a
  [routerLink]="['/product', product().id]"
  class="animate-fadeIn group bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300 border border-gray-100 flex flex-col h-full"
>
  <div class="relative w-full aspect-4/3 bg-gray-50 overflow-hidden">
    <img
      class="h-full w-full object-contain mix-blend-multiply transition-transform duration-500 group-hover:scale-105"
      [src]="displayImageUrl()"
      [alt]="product().name"
      loading="lazy"
    />
  </div>

  <div
    class="p-4 flex flex-col grow transition-transform duration-500 group-hover:scale-105"
  >
    <h3 class="text-lg font-semibold text-gray-800 truncate">
      {{ product().name }}
    </h3>
    <p class="text-gray-500 text-sm mb-4 line-clamp-2">
      {{ product().brand }}
    </p>

    <div class="flex items-center justify-between">
      <span class="text-xl font-bold text-gray-900"
        >{{
          getProductPrice()
            | currency: getProductCurrency() : "symbol" : "1.0-0"
        }}
      </span>
    </div>
  </div>
</a>
