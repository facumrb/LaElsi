<a
  [routerLink]="['/product', product().id]"
  class="group relative flex flex-col h-full bg-white rounded-xl shadow-sm hover:shadow-xl border border-gray-100 transition-all duration-300 overflow-hidden focus:outline-none focus:ring-2 focus:ring-[#3d4494] focus:ring-offset-2"
  [attr.aria-label]="'Ver detalles de ' + product().name"
>
  <div class="relative w-full aspect-4/3 bg-gray-50 overflow-hidden">
    <img
      class="h-full w-full object-contain mix-blend-multiply transition-transform duration-500 group-hover:scale-110 will-change-transform"
      [src]="displayImageUrl()"
      [alt]="product().name"
      width="300"
      height="225"
      loading="lazy"
      (error)="handleImageError($event)"
    />
  </div>

  <div class="p-4 flex flex-col grow">
    <p
      class="text-xs font-bold text-[#037971] uppercase tracking-wide mb-1 truncate"
    >
      {{ product().brand || "Genérico" }}
    </p>

    <h2
      class="text-base font-bold text-gray-800 leading-tight mb-2 line-clamp-2 transition-colors"
      [title]="product().name"
    >
      {{ product().name }}
    </h2>

    <div
      class="mt-auto pt-2 flex items-center justify-between border-t border-gray-50"
    >
      <div class="flex flex-col">
        <span class="text-lg font-black text-gray-900">
          {{ price() | currency: currency() : "symbol" : "1.0-0" }}
        </span>
      </div>

      <div
        class="opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300"
      >
        <ng-icon name="bootstrapArrowRight" class="text-xl"></ng-icon>
      </div>
    </div>
  </div>
</a>
