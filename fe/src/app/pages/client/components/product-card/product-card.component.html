<a
  [routerLink]="['/product', product().id]"
  class="group relative flex flex-col h-full bg-white rounded-xl shadow-sm hover:shadow-xl hover:-translate-y-1 border border-gray-100 transition-all duration-300 overflow-hidden"
>
  <div class="relative w-full aspect-4/3 bg-gray-50 overflow-hidden">
    <img
      class="h-full w-full object-contain mix-blend-multiply transition-opacity duration-500 will-change-transform"
      [src]="displayImageUrl()"
      alt=""
      width="300"
      height="225"
      loading="lazy"
      (error)="handleImageError($event)"
    />
  </div>

  <div class="p-4 flex flex-col grow">
    <p
      class="text-xs font-bold text-[#037971] uppercase tracking-wide mb-1 truncate"
    >
      {{ product().brand || "Marca Genérica" }}
    </p>

    <h2
      class="text-base font-bold text-gray-800 leading-tight mb-2 line-clamp-2 transition-colors"
    >
      {{ product().name }}
    </h2>

    <div
      class="mt-auto pt-4 flex items-center justify-between border-t border-gray-50"
    >
      <div class="flex flex-col">
        <span class="text-xl font-black text-gray-900">
          {{ price() | currency: currency() : "symbol" : "1.0-0" }}
        </span>
      </div>

      <button
        (click)="addToCart($event)"
        [disabled]="product().stock <= 0 || addedToCart()"
        aria-label="Añadir al carrito"
        class="h-10 w-10 flex items-center justify-center rounded-full bg-gray-900 text-white hover:bg-[#f4abac] transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed shadow-md cursor-pointer"
      >
        @if (addedToCart()) {
          <ng-icon
            name="bootstrapCheckLg"
            class="text-lg animate-in zoom-in"
          ></ng-icon>
        } @else {
          <ng-icon name="bootstrapCartPlus" class="text-lg"></ng-icon>
        }
      </button>
    </div>
  </div>
</a>
