<div
  class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6"
>
  <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto">
    <div class="flex flex-row gap-2 w-full md:w-auto">
      <div
        class="relative flex-1 md:flex-none"
        (clickOutside)="showFilterMenu.set(false)"
      >
        <app-filter-button
          [isActive]="isAnyFilterActive()"
          [(isOpen)]="showFilterMenu"
        ></app-filter-button>

        @if (showFilterMenu()) {
          <div
            id="filter-dropdown"
            class="absolute right-0 md:right-auto md:left-0 mt-3 w-80 max-w-[95vw] origin-top-right rounded-2xl bg-white shadow-2xl ring-1 ring-gray-950/5 z-50 border border-gray-100 transition-all"
            role="region"
            aria-label="Opciones de filtro"
          >
            <div class="p-4 space-y-5">
              <app-filter-accordion
                label="Ordenar por Precio"
                [options]="priceOptions"
                [(selected)]="priceOrder"
              ></app-filter-accordion>

              <hr class="border-gray-100" />

              <app-filter-accordion
                label="Filtrar por Marca"
                [options]="brandOptions()"
                [(selected)]="brandFilter"
              ></app-filter-accordion>

              <hr class="border-gray-100" />

              <app-filter-accordion
                label="Ordenar por Popularidad"
                [options]="popularityOptions"
                [(selected)]="popularityOrder"
              ></app-filter-accordion>

              <button
                type="button"
                (click)="limpiar()"
                class="cursor-pointer w-full mt-4 px-3 py-2.5 text-xs font-bold uppercase tracking-wide text-[#3d4494] bg-indigo-50 rounded-lg hover:bg-indigo-100 transition-colors focus:outline-none focus:ring-2 focus:ring-[#3d4494] focus:ring-offset-1"
              >
                Limpiar todos los filtros
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
