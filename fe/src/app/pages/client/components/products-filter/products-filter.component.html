<div
  class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6"
>
  <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto">
    <div class="flex flex-row gap-2 w-full md:w-auto">
      <div
        class="relative flex-1 md:flex-none"
        (clickOutside)="showFilterMenu.set(false)"
      >
        <button
          (click)="toggleMenu()"
          class="cursor-pointer flex w-full md:w-auto justify-center items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-all"
          [class.ring-2]="isAnyFilterActive()"
          [class.ring-[#3d4494]]="isAnyFilterActive()"
          [class.bg-indigo-50]="isAnyFilterActive()"
        >
          @if (isAnyFilterActive()) {
            <ng-icon
              name="bootstrapFunnelFill"
              class="text-xl text-[#3d4494]"
            ></ng-icon>
          } @else {
            <ng-icon name="bootstrapFunnel" class="text-xl"></ng-icon>
          }
          Filtros
        </button>

        @if (showFilterMenu()) {
          <div
            class="absolute right-0 md:right-auto md:left-0 mt-3 w-80 max-w-[95vw] origin-top-right rounded-2xl bg-white shadow-2xl ring-1 ring-gray-950/5 z-100 border border-gray-100 transition-all"
          >
            <div class="p-4 space-y-4">
              <!-- Filtro de Precio -->
              <div>
                <h3
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
                >
                  Ordenar por Precio
                </h3>
                <div class="space-y-2">
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="precio"
                      [checked]="priceOrder() === 'Defecto'"
                      (change)="setPriceOrder('Defecto')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Defecto</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="precio"
                      [checked]="priceOrder() === 'Menor'"
                      (change)="setPriceOrder('Menor')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Menor a mayor</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="precio"
                      [checked]="priceOrder() === 'Mayor'"
                      (change)="setPriceOrder('Mayor')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Mayor a menor</span>
                  </label>
                </div>
              </div>

              <hr class="border-gray-100" />

              <!-- Filtro de Marca -->
              <div>
                <h3
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
                >
                  Filtrar por Marca
                </h3>
                <select
                  [ngModel]="brandFilter()"
                  (ngModelChange)="brandFilter.set($event)"
                  class="w-full bg-gray-50 border border-gray-300 rounded-lg text-sm p-2 text-gray-700 focus:ring-2 focus:ring-[#3d4494] focus:border-[#3d4494]"
                >
                  <option value="Todas">Todas las marcas</option>
                  @for (brand of brands(); track brand) {
                    <option [value]="brand">{{ brand }}</option>
                  }
                </select>
              </div>

              <hr class="border-gray-100" />

              <!-- Filtro de Popularidad (Ordenar por Ventas) -->
              <div>
                <h3
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
                >
                  Ordenar por Ventas
                </h3>
                <div class="space-y-2">
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="ventas"
                      [checked]="popularityOrder() === 'Defecto'"
                      (change)="setPopularityOrder('Defecto')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Defecto</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="ventas"
                      [checked]="popularityOrder() === 'MasVentas'"
                      (change)="setPopularityOrder('MasVentas')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Mayor a menor</span>
                  </label>
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded"
                  >
                    <input
                      type="radio"
                      name="ventas"
                      [checked]="popularityOrder() === 'MenosVentas'"
                      (change)="setPopularityOrder('MenosVentas')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span class="text-sm text-gray-700">Menor a mayor</span>
                  </label>
                </div>
              </div>

              <button
                (click)="limpiar()"
                class="cursor-pointer w-full mt-2 px-3 py-2 text-xs font-medium text-[#3d4494] bg-indigo-50 rounded hover:bg-indigo-100 transition-colors"
              >
                Limpiar Filtros
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
