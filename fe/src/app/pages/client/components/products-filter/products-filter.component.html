<div
  class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6"
>
  <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto">
    <div class="flex flex-row gap-2 w-full md:w-auto">
      <div
        class="relative flex-1 md:flex-none"
        (clickOutside)="showFilterMenu.set(false)"
      >
        <button
          type="button"
          (click)="toggleMenu()"
          class="cursor-pointer flex w-full md:w-auto justify-center items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-all focus:outline-none focus:ring-2 focus:ring-[#3d4494] focus:ring-offset-2"
          [class.ring-2]="isAnyFilterActive()"
          [class.ring-[#3d4494]]="isAnyFilterActive()"
          [class.bg-indigo-50]="isAnyFilterActive()"
          [attr.aria-expanded]="showFilterMenu()"
          aria-haspopup="true"
          aria-controls="filter-dropdown"
          aria-label="Mostrar opciones de filtrado y ordenamiento"
        >
          @if (isAnyFilterActive()) {
            <ng-icon
              name="bootstrapFunnelFill"
              class="text-xl text-[#3d4494]"
              aria-hidden="true"
            ></ng-icon>
          } @else {
            <ng-icon
              name="bootstrapFunnel"
              class="text-xl"
              aria-hidden="true"
            ></ng-icon>
          }
          Filtros
          @if (isAnyFilterActive()) {
            <span class="sr-only">(Filtros activos)</span>
          }
        </button>

        @if (showFilterMenu()) {
          <div
            id="filter-dropdown"
            class="absolute right-0 md:right-auto md:left-0 mt-3 w-80 max-w-[95vw] origin-top-right rounded-2xl bg-white shadow-2xl ring-1 ring-gray-950/5 z-50 border border-gray-100 transition-all"
            role="region"
            aria-label="Opciones de filtro"
          >
            <div class="p-4 space-y-5">
              <fieldset class="space-y-2">
                <legend
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
                >
                  Ordenar por Precio
                </legend>

                <div class="space-y-2">
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded group"
                  >
                    <input
                      type="radio"
                      name="precioOrder"
                      value="Defecto"
                      [checked]="priceOrder() === 'Defecto'"
                      (change)="setPriceOrder('Defecto')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span
                      class="text-sm text-gray-700 group-hover:text-[#3d4494]"
                      >Defecto</span
                    >
                  </label>

                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded group"
                  >
                    <input
                      type="radio"
                      name="precioOrder"
                      value="Menor"
                      [checked]="priceOrder() === 'Menor'"
                      (change)="setPriceOrder('Menor')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span
                      class="text-sm text-gray-700 group-hover:text-[#3d4494]"
                      >Menor a mayor</span
                    >
                  </label>

                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded group"
                  >
                    <input
                      type="radio"
                      name="precioOrder"
                      value="Mayor"
                      [checked]="priceOrder() === 'Mayor'"
                      (change)="setPriceOrder('Mayor')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span
                      class="text-sm text-gray-700 group-hover:text-[#3d4494]"
                      >Mayor a menor</span
                    >
                  </label>
                </div>
              </fieldset>

              <hr class="border-gray-100" />

              <div>
                <label
                  for="brand-select"
                  class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
                >
                  Filtrar por Marca
                </label>
                <select
                  id="brand-select"
                  [ngModel]="brandFilter()"
                  (ngModelChange)="brandFilter.set($event)"
                  class="w-full bg-gray-50 border border-gray-300 rounded-lg text-sm p-2 text-gray-700 focus:ring-2 focus:ring-[#3d4494] focus:border-[#3d4494] cursor-pointer"
                >
                  <option value="Todas">Todas las marcas</option>
                  @for (brand of brands(); track brand) {
                    <option [value]="brand">{{ brand }}</option>
                  }
                </select>
              </div>

              <hr class="border-gray-100" />

              <fieldset class="space-y-2">
                <legend
                  class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2"
                >
                  Ordenar por Popularidad
                </legend>

                <div class="space-y-2">
                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded group"
                  >
                    <input
                      type="radio"
                      name="ventasOrder"
                      value="Defecto"
                      [checked]="popularityOrder() === 'Defecto'"
                      (change)="setPopularityOrder('Defecto')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span
                      class="text-sm text-gray-700 group-hover:text-[#3d4494]"
                      >Defecto</span
                    >
                  </label>

                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded group"
                  >
                    <input
                      type="radio"
                      name="ventasOrder"
                      value="MasVentas"
                      [checked]="popularityOrder() === 'MasVentas'"
                      (change)="setPopularityOrder('MasVentas')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span
                      class="text-sm text-gray-700 group-hover:text-[#3d4494]"
                      >Más vendidos</span
                    >
                  </label>

                  <label
                    class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1 rounded group"
                  >
                    <input
                      type="radio"
                      name="ventasOrder"
                      value="MenosVentas"
                      [checked]="popularityOrder() === 'MenosVentas'"
                      (change)="setPopularityOrder('MenosVentas')"
                      class="text-[#3d4494] focus:ring-[#3d4494]"
                    />
                    <span
                      class="text-sm text-gray-700 group-hover:text-[#3d4494]"
                      >Menos vendidos</span
                    >
                  </label>
                </div>
              </fieldset>

              <button
                type="button"
                (click)="limpiar()"
                class="cursor-pointer w-full mt-2 px-3 py-2.5 text-xs font-bold uppercase tracking-wide text-[#3d4494] bg-indigo-50 rounded-lg hover:bg-indigo-100 transition-colors focus:outline-none focus:ring-2 focus:ring-[#3d4494] focus:ring-offset-1"
              >
                Limpiar todos los filtros
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
